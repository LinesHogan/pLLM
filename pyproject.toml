[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "tllm"
version = "0.1.0"
description = "Auxiliary-workload compiler middle-end for the vLLM inference engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "einops==0.8.2",
    "opt-einsum>=3.4,<4",
    "safetensors>=0.4,<1",
]

[project.optional-dependencies]
# vLLM 0.27 backend drivers (MRv1 + MRv2). For CUDA 12.x drivers, install
# the cu129 wheels instead of the default cu130 builds — see
# docs/environment.md.
vllm027 = ["vllm>=0.27.1,<0.28"]
test = ["pytest==9.0.3"]
tlm = ["transformers>=5.0,<6", "peft>=0.20,<0.21"]

# Runs in every vLLM process (parent, EngineCore child, workers) to
# rehydrate the tLLM runtime under VLLM_ENABLE_V1_MULTIPROCESSING=1.
[project.entry-points."vllm.general_plugins"]
tllm = "tllm.runtime.mp.plugin:tllm_general_plugin"

[tool.maturin]
manifest-path = "rust/tllm_core/Cargo.toml"
python-source = "."
module-name = "tllm._core"
features = ["pyo3/extension-module"]
