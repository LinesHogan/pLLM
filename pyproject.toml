[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "pllm"
version = "0.1.0"
description = "Run stateful and adaptive inference-time PyTorch algorithms inside vLLM with CUDA graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cattrs>=23.2,<27",
    "cloudpickle>=3.0,<4",
    "torch>=2.13,<2.16",
    "triton>=3.7,<4",
]

[project.optional-dependencies]
# pllm runs on vLLM 0.27 through 0.34; pllm/backends/vllm/compat.py holds release differences.
vllm027 = ["vllm==0.27.1"]
vllm032 = ["vllm==0.32.0"]
vllm034 = ["vllm==0.34.0"]
vllm = ["vllm>=0.27.0,<0.35"]
test = [
    "pytest==9.0.3",
    "maturin>=1.14,<2.0",
    "pyright==1.1.411",
    "ruff==0.17.1",
    "markdown-it-py>=4,<5",
    "github-slugger==0.0.3",
]

[project.scripts]
pllm = "pllm.cli:main"

[project.urls]
Repository = "https://github.com/LinesHogan/pLLM"
Documentation = "https://github.com/LinesHogan/pLLM/blob/main/doc/README.md"
Issues = "https://github.com/LinesHogan/pLLM/issues"

[tool.maturin]
manifest-path = "rust/pllm_core/Cargo.toml"
python-source = "."
module-name = "pllm._core"
features = ["pyo3/extension-module"]
include = ["pllm/_skill/*.md"]
exclude = ["blog/**", "doc/**", "test/**", "tools/**", "examples/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["rust", "typings", "doc", "*.md"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]
# Short TypeVar names (I, R) and assigned lambdas are idiomatic here.
ignore = ["E741", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["pllm", "test"]
combine-as-imports = true

[tool.pytest.ini_options]
# Author loop: CUDA_VISIBLE_DEVICES= pytest -m "not gpu" test/boundary test/workloads
# GPU core lives in test/gpu/core; feature integration lives in test/gpu/features.
markers = ["slow: spawns subprocesses or a real vLLM engine; excluded by -m 'not slow'", "gpu: needs a visible CUDA device"]
