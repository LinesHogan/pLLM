[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "pllm"
version = "0.1.0"
description = "Auxiliary-workload compiler middle-end for the vLLM inference engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "rust/vendor/isl-rs/LICENSE", "rust/vendor/isl-rs/isl/LICENSE", "rust/vendor/isl-rs/isl/imath/LICENSE"]
dependencies = [
    "cattrs>=25.3,<26",
    "torch>=2.13,<2.14",
    "triton>=3.7,<3.8",
]

[project.optional-dependencies]
# Both concrete runner adapters target this exact vLLM release.
vllm027 = ["vllm==0.27.1"]
test = ["pytest==9.0.3", "maturin>=1.14,<2.0", "pyright==1.1.411", "ruff==0.17.1"]
tlm = ["transformers>=5.0,<6", "peft>=0.20,<0.21", "safetensors>=0.4,<1"]

[tool.maturin]
manifest-path = "rust/pllm_core/Cargo.toml"
python-source = "."
module-name = "pllm._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["rust", "typings", "doc", "*.md"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]
# Short TypeVar names (I, R) and assigned lambdas are idiomatic here.
ignore = ["E741", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["pllm", "test"]
