<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" role="img" aria-label="pLLM Two-Stream Step Timeline: Step n side-stream training overlapping Step n+1 main-stream forward">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 11px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="412" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="28" y="32" class="title">Two-Stream Step Timeline · Overlapped Main &amp; Side Execution</text>
  <text x="892" y="32" text-anchor="end" class="sub">Ordered anchors with publish_lag=1 concurrency</text>

  <!-- Overlap Highlight Box -->
  <rect x="618" y="192" width="246" height="148" rx="6" fill="#fefce8" stroke="#d99b26" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="741" y="354" text-anchor="middle" class="sub" fill="#92400e">Step n side training overlaps Step n+1 forward</text>

  <!-- Vertical Anchor Guide Lines -->
  <line x1="168" y1="76" x2="168" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="282" y1="104" x2="282" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="396" y1="76" x2="396" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="510" y1="104" x2="510" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="624" y1="76" x2="624" y2="338" stroke="#e62b2b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="738" y1="104" x2="738" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="852" y1="76" x2="852" y2="338" stroke="#d4d4d8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Top Anchor Pills -->
  <text x="28" y="84" class="label">Anchors</text>

  <!-- Row 1 Anchors (y=54) -->
  <rect x="108" y="54" width="120" height="22" rx="4" fill="#111111"/>
  <text x="168" y="69" text-anchor="middle" class="mono" fill="#ffffff" style="fill:#ffffff">request.prepare</text>

  <rect x="342" y="54" width="108" height="22" rx="4" fill="#111111"/>
  <text x="396" y="69" text-anchor="middle" class="mono" fill="#ffffff" style="fill:#ffffff">state.publish</text>

  <rect x="572" y="54" width="104" height="22" rx="4" fill="#e62b2b"/>
  <text x="624" y="69" text-anchor="middle" class="mono" fill="#ffffff" style="fill:#ffffff">token.commit</text>

  <rect x="812" y="54" width="80" height="22" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1"/>
  <text x="852" y="69" text-anchor="middle" class="mono">n+1 publish</text>

  <!-- Row 2 Anchors (y=82) -->
  <rect x="228" y="82" width="108" height="22" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1.1"/>
  <text x="282" y="97" text-anchor="middle" class="mono">model.execute</text>

  <rect x="446" y="82" width="128" height="22" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1.1"/>
  <text x="510" y="97" text-anchor="middle" class="mono">sampler.pre_draw</text>

  <rect x="686" y="82" width="104" height="22" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1.1"/>
  <text x="738" y="97" text-anchor="middle" class="mono">next.prepare</text>

  <!-- Track Labels -->
  <rect x="28" y="126" width="124" height="52" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="90" y="148" text-anchor="middle" class="label">Step n</text>
  <text x="90" y="166" text-anchor="middle" class="badge" fill="#0047ab">MAIN STREAM</text>

  <rect x="28" y="200" width="124" height="52" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="90" y="222" text-anchor="middle" class="label">Step n</text>
  <text x="90" y="240" text-anchor="middle" class="badge" fill="#059669">SIDE STREAM</text>

  <rect x="28" y="274" width="124" height="52" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="90" y="296" text-anchor="middle" class="label">Step n+1</text>
  <text x="90" y="314" text-anchor="middle" class="badge" fill="#0047ab">MAIN STREAM</text>

  <!-- Track 1 Bars: Step n main -->
  <rect x="170" y="126" width="108" height="52" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="224" y="149" text-anchor="middle" class="label">Metadata Prep</text>
  <text x="224" y="167" text-anchor="middle" class="sub">slots &amp; attn</text>

  <rect x="284" y="126" width="108" height="52" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="338" y="149" text-anchor="middle" class="label">Forward n</text>
  <text x="338" y="167" text-anchor="middle" class="sub">CUDA Graph</text>

  <rect x="398" y="126" width="108" height="52" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="452" y="149" text-anchor="middle" class="mono">predict</text>
  <text x="452" y="167" text-anchor="middle" class="sub">@guide_sampling</text>

  <rect x="512" y="126" width="108" height="52" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="566" y="149" text-anchor="middle" class="label">Sampler Draw</text>
  <text x="566" y="167" text-anchor="middle" class="sub">commit token</text>

  <!-- Track 2 Bars: Step n side -->
  <rect x="170" y="200" width="176" height="52" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="258" y="223" text-anchor="middle" class="label">Token Lookup (side)</text>
  <text x="258" y="241" text-anchor="middle" class="sub">Overlaps Step n forward</text>

  <rect x="624" y="200" width="234" height="52" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.6"/>
  <text x="741" y="223" text-anchor="middle" class="label">Loss Backward &amp; AdamW (Step n)</text>
  <text x="741" y="241" text-anchor="middle" class="sub">token.commit / side / captured</text>

  <!-- Track 3 Bars: Step n+1 main -->
  <rect x="626" y="274" width="108" height="52" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="680" y="297" text-anchor="middle" class="label">Prep n+1</text>
  <text x="680" y="315" text-anchor="middle" class="sub">Reads n-1 snap</text>

  <rect x="740" y="274" width="110" height="52" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="795" y="297" text-anchor="middle" class="label">Forward n+1</text>
  <text x="795" y="315" text-anchor="middle" class="sub">Zero-stall run</text>

  <!-- Arrows from token.commit -->
  <path d="M 624 178 L 624 196" fill="none" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <path d="M 618 178 L 618 270" fill="none" stroke="#111111" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arrow-ink)"/>

  <!-- Bottom Explanation Bar -->
  <rect x="28" y="366" width="864" height="32" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.2"/>
  <rect x="38" y="372" width="114" height="20" rx="4" fill="#111111"/>
  <text x="95" y="386" text-anchor="middle" class="badge" fill="#ffffff">PUBLISH_LAG = 1</text>
  <text x="164" y="387" class="sub">Step n updates become readable at Step n+2 (boundary, 1); trainers always read (latest, 0) with zero lost gradients.</text>
</svg>
