<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" role="img" aria-label="pLLM Documentation Roadmap: Five Entry Points by Goal">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="392" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="28" y="34" class="title">Documentation Roadmap · Five Entry Points</text>
  <text x="892" y="34" text-anchor="end" class="sub">Each section does one job—jump straight to what you need</text>

  <!-- Row 1: Tutorials -->
  <rect x="28" y="58" width="292" height="50" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="72" width="28" height="22" rx="4" fill="#111111"/>
  <text x="54" y="87" text-anchor="middle" class="badge" fill="#ffffff">01</text>
  <text x="80" y="88" class="label">First time using pLLM</text>
  <line x1="320" y1="83" x2="351" y2="83" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="359" y="61" width="536" height="50" rx="6" fill="#111111"/>
  <rect x="356" y="58" width="536" height="50" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="370" y="72" width="96" height="22" rx="4" fill="#0047ab"/>
  <text x="418" y="87" text-anchor="middle" class="badge" fill="#ffffff">TUTORIALS</text>
  <text x="480" y="88" class="label">Tutorial 00 (Quickstart), then follow track 01–05</text>

  <!-- Row 2: Guides -->
  <rect x="28" y="122" width="292" height="50" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="136" width="28" height="22" rx="4" fill="#111111"/>
  <text x="54" y="151" text-anchor="middle" class="badge" fill="#ffffff">02</text>
  <text x="80" y="152" class="label">Authoring your own workload</text>
  <line x1="320" y1="147" x2="351" y2="147" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="359" y="125" width="536" height="50" rx="6" fill="#111111"/>
  <rect x="356" y="122" width="536" height="50" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <rect x="370" y="136" width="96" height="22" rx="4" fill="#059669"/>
  <text x="418" y="151" text-anchor="middle" class="badge" fill="#ffffff">GUIDES</text>
  <text x="480" y="152" class="label">Workload Anatomy, then topic guides as needed</text>

  <!-- Row 3: How-To -->
  <rect x="28" y="186" width="292" height="50" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="200" width="28" height="22" rx="4" fill="#111111"/>
  <text x="54" y="215" text-anchor="middle" class="badge" fill="#ffffff">03</text>
  <text x="80" y="216" class="label">Hitting a specific problem</text>
  <line x1="320" y1="211" x2="351" y2="211" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="359" y="189" width="536" height="50" rx="6" fill="#111111"/>
  <rect x="356" y="186" width="536" height="50" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="370" y="200" width="96" height="22" rx="4" fill="#d99b26"/>
  <text x="418" y="215" text-anchor="middle" class="badge" fill="#111111">HOW-TO</text>
  <text x="480" y="216" class="label">Troubleshooting, loading weights, serving, bench…</text>

  <!-- Row 4: Capability Map & Design Tradeoffs -->
  <rect x="28" y="250" width="292" height="50" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="264" width="28" height="22" rx="4" fill="#111111"/>
  <text x="54" y="279" text-anchor="middle" class="badge" fill="#ffffff">04</text>
  <text x="80" y="280" class="label">Checking if an algorithm fits</text>
  <line x1="320" y1="275" x2="351" y2="275" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="359" y="253" width="536" height="50" rx="6" fill="#111111"/>
  <rect x="356" y="250" width="536" height="50" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <rect x="370" y="264" width="96" height="22" rx="4" fill="#e62b2b"/>
  <text x="418" y="279" text-anchor="middle" class="badge" fill="#ffffff">EXPLAIN</text>
  <text x="480" y="280" class="label">Capability Map (can it run) · Design Tradeoffs (why)</text>

  <!-- Row 5: Reference -->
  <rect x="28" y="314" width="292" height="50" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="328" width="28" height="22" rx="4" fill="#111111"/>
  <text x="54" y="343" text-anchor="middle" class="badge" fill="#ffffff">05</text>
  <text x="80" y="344" class="label">Looking up fields or errors</text>
  <line x1="320" y1="339" x2="351" y2="339" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="359" y="317" width="536" height="50" rx="6" fill="#111111"/>
  <rect x="356" y="314" width="536" height="50" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="370" y="328" width="96" height="22" rx="4" fill="#111111"/>
  <text x="418" y="343" text-anchor="middle" class="badge" fill="#ffffff">REFERENCE</text>
  <text x="480" y="344" class="label">Field specs, config keys, support matrix &amp; errors</text>
</svg>
