<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" role="img" aria-label="pLLM Architecture Overview: Declarative PyTorch Workload, CPU Pre-Flight Planner and Verifier, and Programmable Hook Surfaces in Unmodified vLLM">
  <style>
    .title { font: 800 16.5px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #111111; }
    .hdr { font: 700 13.5px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #ffffff; letter-spacing: 0.01em; }
    .label { font: 700 13px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #111111; }
    .sub { font: 400 11.8px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #3f3f46; }
    .muted { font: 500 11.2px "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52525b; }
    .mono { font: 600 11.4px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.5px "JetBrains Mono", "SF Mono", Menlo, monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="952" height="502" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Top Header Bar -->
  <text x="26" y="33" class="title">pLLM (Programmable LLM) — "eBPF for vLLM" Architecture</text>
  <text x="934" y="33" text-anchor="end" class="muted">Zero engine forks · Declarative PyTorch · Continuous batching &amp; CUDA Graphs</text>
  <line x1="24" y1="45" x2="936" y2="45" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- ==================== COLUMN 1: DECLARATIVE WORKLOAD ==================== -->
  <rect x="27" y="61" width="224" height="426" rx="6" fill="#111111"/>
  <rect x="24" y="58" width="224" height="426" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="24" y="58" width="224" height="38" rx="6" fill="#111111"/>
  <rect x="24" y="84" width="224" height="12" fill="#111111"/>
  <text x="136" y="82" text-anchor="middle" class="hdr">1. Declarative pllm.Workload</text>

  <!-- 1A: READ -->
  <rect x="36" y="108" width="200" height="102" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="46" y="117" width="50" height="19" rx="4" fill="#0047ab"/>
  <text x="71" y="130" text-anchor="middle" class="badge" fill="#ffffff">READ</text>
  <text x="104" y="130" class="muted">Model internals</text>
  <text x="46" y="152" class="mono">hidden · residual</text>
  <text x="46" y="172" class="mono">layer_logits · attention</text>
  <text x="46" y="192" class="mono">input_tokens · sampled</text>

  <!-- 1B: STATE (Optional) -->
  <rect x="36" y="220" width="200" height="94" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="46" y="229" width="56" height="19" rx="4" fill="#d99b26"/>
  <text x="74" y="242" text-anchor="middle" class="badge" fill="#111111">STATE</text>
  <text x="110" y="242" class="muted">Stateless or scoped</text>
  <text x="46" y="264" class="mono">RequestState · InstanceState</text>
  <text x="46" y="284" class="mono">PositionState · Pretrained</text>
  <text x="46" y="302" class="sub">HBM or pinned host DRAM</text>

  <!-- 1C: INTERVENE / ACT -->
  <rect x="36" y="324" width="200" height="148" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="46" y="333" width="84" height="19" rx="4" fill="#e62b2b"/>
  <text x="88" y="346" text-anchor="middle" class="badge" fill="#ffffff">INTERVENE</text>
  <text x="138" y="346" class="muted">Hook surfaces</text>
  <text x="46" y="369" class="sub">• <tspan class="mono">@export</tspan> probes &amp; telemetry</text>
  <text x="46" y="390" class="sub">• <tspan class="mono">Patch / Adapter</tspan> overlays</text>
  <text x="46" y="411" class="sub">• <tspan class="mono">@custom_attention / forward</tspan></text>
  <text x="46" y="432" class="sub">• <tspan class="mono">@add_logits / guide_sampling</tspan></text>
  <text x="46" y="453" class="sub">• <tspan class="mono">@write / @train</tspan> state evolution</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="248" y1="271" x2="268" y2="271" stroke="#111111" stroke-width="2" marker-end="url(#arr-ink)"/>

  <!-- ==================== COLUMN 2: CPU PRE-FLIGHT ==================== -->
  <rect x="275" y="61" width="196" height="426" rx="6" fill="#111111"/>
  <rect x="272" y="58" width="196" height="426" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="272" y="58" width="196" height="38" rx="6" fill="#0047ab"/>
  <rect x="272" y="84" width="196" height="12" fill="#0047ab"/>
  <text x="370" y="82" text-anchor="middle" class="hdr">2. CPU Planner &amp; Verifier</text>

  <rect x="290" y="108" width="160" height="24" rx="12" fill="#eef4ff" stroke="#0047ab" stroke-width="1.25"/>
  <text x="370" y="124" text-anchor="middle" class="badge" fill="#0047ab">PRE-FLIGHT · 0 GPU</text>

  <!-- explain card -->
  <rect x="284" y="142" width="172" height="148" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="294" y="152" width="108" height="20" rx="4" fill="#111111"/>
  <text x="348" y="166" text-anchor="middle" class="badge" fill="#ffffff">pllm.explain</text>
  <text x="294" y="191" class="label">Execution Plan &amp; Cost</text>
  <text x="294" y="213" class="sub">• Step-anchor placement</text>
  <text x="294" y="234" class="sub">• CUDA Graph &amp; op fusion</text>
  <text x="294" y="255" class="sub">• Exact VRAM &amp; page cap</text>
  <text x="294" y="276" class="sub">• Zero host-sync audit</text>

  <!-- check card -->
  <rect x="284" y="302" width="172" height="170" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="294" y="312" width="118" height="20" rx="4" fill="#059669"/>
  <text x="353" y="326" text-anchor="middle" class="badge" fill="#ffffff">testing.check</text>
  <text x="294" y="351" class="label">Multi-Tenant Contracts</text>
  <text x="294" y="373" class="sub">• Row-order invariance</text>
  <text x="294" y="394" class="sub">• Cross-tenant isolation</text>
  <text x="294" y="415" class="sub">• Chunked prefill parity</text>
  <text x="294" y="436" class="sub">• KV preemption safety</text>
  <text x="294" y="457" class="sub">• Neutral no-op equivalence</text>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="468" y1="271" x2="488" y2="271" stroke="#111111" stroke-width="2" marker-end="url(#arr-ink)"/>

  <!-- ==================== COLUMN 3: UNMODIFIED VLLM RUNTIME ==================== -->
  <rect x="495" y="61" width="444" height="426" rx="6" fill="#111111"/>
  <rect x="492" y="58" width="444" height="426" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="492" y="58" width="444" height="38" rx="6" fill="#111111"/>
  <rect x="492" y="84" width="444" height="12" fill="#111111"/>
  <text x="714" y="82" text-anchor="middle" class="hdr">3. Unmodified vLLM Engine (0.27–0.34)</text>

  <!-- Serving Entry Points Strip -->
  <rect x="506" y="106" width="416" height="34" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.2"/>
  <text x="518" y="127" class="badge" fill="#111111">ENTRY:</text>
  <text x="572" y="127" class="mono">make_llm</text>
  <text x="642" y="127" class="muted">·</text>
  <text x="654" y="127" class="mono">make_async_llm</text>
  <text x="774" y="127" class="muted">·</text>
  <text x="786" y="127" class="mono">pllm serve</text>
  <text x="866" y="127" class="muted">(SSE)</text>

  <!-- Programmable Inference Pipeline Box -->
  <rect x="506" y="150" width="416" height="186" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="518" y="160" width="252" height="20" rx="4" fill="#0047ab"/>
  <text x="644" y="174" text-anchor="middle" class="badge" fill="#ffffff">PROGRAMMABLE HOOK SURFACES (IN-GRAPH)</text>
  <text x="910" y="174" text-anchor="end" class="muted">Packed [tokens, H]</text>

  <!-- Stage A: Input & Lookup -->
  <rect x="518" y="188" width="120" height="108" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="526" y="196" width="104" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="578" y="209" text-anchor="middle" class="badge">INPUT &amp; TABLES</text>
  <text x="578" y="232" text-anchor="middle" class="sub">Token history</text>
  <text x="578" y="251" text-anchor="middle" class="sub">N-gram / Engram</text>
  <text x="578" y="270" text-anchor="middle" class="sub">memory lookup</text>
  <text x="578" y="288" text-anchor="middle" class="muted">(HBM or host DRAM)</text>

  <line x1="638" y1="242" x2="651" y2="242" stroke="#111111" stroke-width="1.7" marker-end="url(#arr-ink)"/>

  <!-- Stage B: Decoder Layers & Paged KV -->
  <rect x="654" y="188" width="132" height="108" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="662" y="196" width="116" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="720" y="209" text-anchor="middle" class="badge">LAYERS &amp; KV</text>
  <text x="720" y="232" text-anchor="middle" class="sub">Steering &amp; LoRA</text>
  <text x="720" y="251" text-anchor="middle" class="sub">Residual / Triton ops</text>
  <text x="720" y="270" text-anchor="middle" class="sub">Sparse / MLA KV</text>
  <text x="720" y="288" text-anchor="middle" class="sub">Looped / early exit</text>

  <line x1="786" y1="242" x2="799" y2="242" stroke="#111111" stroke-width="1.7" marker-end="url(#arr-ink)"/>

  <!-- Stage C: Logits, Sampler & Export -->
  <rect x="802" y="188" width="108" height="108" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <rect x="810" y="196" width="92" height="18" rx="3" fill="#fefce8" stroke="#111111" stroke-width="1"/>
  <text x="856" y="209" text-anchor="middle" class="badge">LOGITS &amp; I/O</text>
  <text x="856" y="232" text-anchor="middle" class="sub">DoLa / Logit Lens</text>
  <text x="856" y="251" text-anchor="middle" class="sub">Guided sampling</text>
  <text x="856" y="270" text-anchor="middle" class="sub">Linear probes &amp;</text>
  <text x="856" y="288" text-anchor="middle" class="sub">SAE telemetry</text>

  <text x="518" y="322" class="sub">15 decoder families · GPTQ / AWQ / FP8 · Tensor Parallelism</text>

  <!-- Bottom Box: Managed Runtime Services -->
  <rect x="506" y="356" width="416" height="116" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="518" y="365" width="250" height="20" rx="4" fill="#059669"/>
  <text x="643" y="379" text-anchor="middle" class="badge" fill="#ffffff">MANAGED STATE &amp; ADAPTIVE SCHEDULING</text>

  <!-- Sub-box 1: Multi-Tenant Paged State -->
  <rect x="518" y="392" width="190" height="70" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="613" y="413" text-anchor="middle" class="label">Paged Multi-Tenant State</text>
  <text x="613" y="433" text-anchor="middle" class="sub">Per-request / session versions</text>
  <text x="613" y="451" text-anchor="middle" class="muted">Live import · Preemption rewind</text>

  <!-- Sub-box 2: Adaptive Execution & Loops -->
  <rect x="720" y="392" width="190" height="70" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="815" y="413" text-anchor="middle" class="label">Adaptive Execution Engine</text>
  <text x="815" y="433" text-anchor="middle" class="sub">Inline graph fusion by default</text>
  <text x="815" y="451" text-anchor="middle" class="muted">Async overlap &amp; host loops</text>

  <!-- Connector between Pipeline & Runtime Services -->
  <line x1="613" y1="356" x2="613" y2="338" stroke="#0047ab" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <line x1="815" y1="336" x2="815" y2="354" stroke="#0047ab" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
</svg>
