# pLLM 文档里的实测数字，每次测量一条记录。
#
# README.md 和 doc/（doc/dev/ 与有日期的技术杂谈除外）的正文里出现的吞吐（tok/s）、耗时（ms）和相对原生 vLLM
# 的百分比，都必须出现在某条记录的 results 里；tools/check_docs.py 会检查。重测时改这里，再改引用它的页面。
# 正文里不是测量的数字（门槛、举例、算式）在所在行末尾写 <!-- check-docs: not measured -->。
#
# 除非结果名另有说明，百分比都相对同一设置下的原生 vLLM（开启 CUDA graph）；每步耗时按“行数 ÷ 吞吐”折算。
# 共同的设置：ignore EOS、temperature 0.8 / top-p 0.95、bf16、VLLM_USE_FLASHINFER_SAMPLER=1，
# 吞吐用 pllm.benchmark.throughput（每轮一次完整的 generate，含 prefill）。
# rows 是并发的序列（“prompt 数 × 每个 prompt 的样本数”或总数）；date 是这次测量写进文档的日期；不知道的写“未记录”。

[[run]]
what = "原生 vLLM 与 ESamp（rank 4）"
date = "2026-11-09"
model = "Qwen/Qwen2.5-7B-Instruct"
gpu = "RTX 4090 24 GiB"
vllm = "0.32.0"
rows = "8 × 16"
tokens = 256
rounds = "预热 1 轮，3 轮中位数"
[run.results]
"原生 vLLM" = "5,894 tok/s，一步 21.7 ms"
"原生 vLLM，eager" = "5,773 tok/s，图模式的 98%"
"ESamp beta=0，publish_lag=1" = "5,738 tok/s，97.4%"
"ESamp beta=0，publish_lag=0" = "5,731 tok/s，97.2%"
"ESamp beta=0.1，publish_lag=1" = "5,681 tok/s，96.4%"
"ESamp beta=0.1，publish_lag=0" = "5,663 tok/s，96.1%"
"ESamp beta=0.5，guidance_capacity=4096（默认）" = "5,678 tok/s，96.3%"
"ESamp beta=0.5，guidance_capacity=1024 或 256" = "5,684 tok/s，96.4%"
"ESamp beta=0.5，guidance_capacity=None（精确 dense）" = "5,533 tok/s，93.9%"
"恒等 custom_residual，只挂第 12 层 / 挂每层 MLP" = "5,722 / 5,721 tok/s，都是 97%"

