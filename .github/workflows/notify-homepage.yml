name: Notify Homepage Sync

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README.zh.md"
      - "llms.txt"
      - "blog/**"
      - "doc/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LinesHogan.github.io sync via repository_dispatch
        env:
          HOMEPAGE_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$HOMEPAGE_TOKEN" ]; then
            echo "::notice::HOMEPAGE_DISPATCH_TOKEN is not configured; LinesHogan.github.io will still pick up updates via its scheduled sync and deploy workflow."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEPAGE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LinesHogan/LinesHogan.github.io/dispatches \
            -d "{\"event_type\":\"pllm-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
