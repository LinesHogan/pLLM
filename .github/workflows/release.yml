name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v0.5.0)"
        required: true
        default: "v0.5.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build source distribution (sdist)
        run: |
          mkdir -p dist
          uvx maturin sdist --out dist
          ls -lh dist/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          python3 - "$TAG" <<'PY'
          import pathlib, re, sys
          tag = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(r"^## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", re.M | re.S)
          m = pattern.search(text)
          body = m.group(1).strip() if m else f"Release {tag} of pLLM (Programmable LLM)."
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(f"Extracted {len(body)} chars of release notes for {tag}")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "pLLM ${{ github.event.inputs.tag || github.ref_name }} — Programmable LLM Layer for vLLM"
          body_path: RELEASE_NOTES.md
          files: dist/*.tar.gz
          draft: false
          prerelease: false
