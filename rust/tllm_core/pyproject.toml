[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tllm_core"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
python-source = "../.."
module-name = "tllm._core"
features = ["pyo3/extension-module"]
