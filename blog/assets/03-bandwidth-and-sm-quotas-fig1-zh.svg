<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 352" width="100%" role="img" aria-label="单步并发解码的硬件配额地图：通道 A 为慢速 PCIe 4.0 x16 链路，通道 B 为片上显存高速权重总线">
  <defs>
    <style>
      .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
      .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
      .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.04em; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="344" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title">单步并发解码的硬件配额地图</text>
  <text x="32" y="59" class="sub">两条共享资源约束决定流水线速度：非抢占式 SM 驻留槽位，以及片上整层权重带宽</text>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Left Node: Pinned Host RAM -->
  <rect x="35" y="99" width="208" height="176" rx="6" fill="#111111"/>
  <rect x="32" y="96" width="208" height="176" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="48" y="110" width="92" height="22" rx="4" fill="#d99b26"/>
  <text x="94" y="125" text-anchor="middle" class="badge" fill="#ffffff">HOST RAM</text>
  <text x="48" y="156" class="label">主机锁页内存</text>
  <text x="48" y="179" class="sub">594 MiB 静态大表</text>
  <text x="48" y="200" class="sub">每步按词号取 128 行</text>
  <rect x="48" y="218" width="176" height="36" rx="5" fill="#ffffff" stroke="#d99b26" stroke-width="1.4"/>
  <text x="136" y="234" text-anchor="middle" class="mono">~37 MiB / 步</text>
  <text x="136" y="249" text-anchor="middle" class="sub">UVA 零拷贝发起加载</text>

  <!-- Channel A Arrow (Host -> GPU) -->
  <rect x="252" y="124" width="82" height="20" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="293" y="138" text-anchor="middle" class="badge" fill="#e62b2b">通道 A</text>
  <text x="293" y="164" text-anchor="middle" class="mono">PCIe 4.0 x16</text>
  <line x1="244" y1="184" x2="340" y2="184" stroke="#e62b2b" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="293" y="206" text-anchor="middle" class="mono" fill="#e62b2b">~24 GB/s</text>
  <text x="293" y="224" text-anchor="middle" class="sub">慢速外置链路</text>

  <!-- Center Node: GPU SM Array -->
  <rect x="349" y="99" width="244" height="176" rx="6" fill="#111111"/>
  <rect x="346" y="96" width="244" height="176" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="362" y="110" width="116" height="22" rx="4" fill="#0047ab"/>
  <text x="420" y="125" text-anchor="middle" class="badge" fill="#ffffff">128 SMs · GPU</text>
  <text x="468" y="156" text-anchor="middle" class="label">GPU 流多处理器阵列</text>
  <text x="468" y="177" text-anchor="middle" class="sub">硬件块调度器按驻留槽位派活</text>
  <rect x="362" y="194" width="212" height="60" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="468" y="216" text-anchor="middle" class="label">非抢占式驻留槽位</text>
  <text x="468" y="236" text-anchor="middle" class="sub">一旦入住即不退房占槽</text>

  <!-- Channel B Arrow (VRAM -> GPU) -->
  <rect x="602" y="124" width="82" height="20" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.3"/>
  <text x="643" y="138" text-anchor="middle" class="badge" fill="#0047ab">通道 B</text>
  <text x="643" y="164" text-anchor="middle" class="mono" fill="#0047ab">~1,000 GB/s</text>
  <line x1="692" y1="184" x2="596" y2="184" stroke="#0047ab" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="643" y="206" text-anchor="middle" class="sub">片上显存</text>
  <text x="643" y="224" text-anchor="middle" class="sub">高速权重总线</text>

  <!-- Right Node: Local VRAM Weights -->
  <rect x="699" y="99" width="192" height="176" rx="6" fill="#111111"/>
  <rect x="696" y="96" width="192" height="176" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="712" y="110" width="104" height="22" rx="4" fill="#111111"/>
  <text x="764" y="125" text-anchor="middle" class="badge" fill="#ffffff">LOCAL VRAM</text>
  <text x="712" y="156" class="label">片上模型权重</text>
  <text x="712" y="179" class="sub">7B 模型共 28 层</text>
  <text x="712" y="200" class="sub">每活跃层须完整读入</text>
  <rect x="712" y="218" width="160" height="36" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="792" y="234" text-anchor="middle" class="mono">~466 MB / 层</text>
  <text x="792" y="249" text-anchor="middle" class="sub">整批共享读取</text>

  <!-- Bottom Takeaway Bar -->
  <rect x="32" y="294" width="856" height="30" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.25"/>
  <text x="460" y="313" text-anchor="middle" class="sub">核心结论：快慢不取决于单行省了多少算术，而取决于谁占住了 SM 驻留槽位与整层权重带宽。</text>
</svg>
