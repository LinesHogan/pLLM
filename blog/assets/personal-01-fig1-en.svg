<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" width="100%" role="img" aria-label="FIG 01 · Eager In-Place Write vs. AOT Functionalization Copy-Back Overwrite">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 700 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 700 12.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .muted { font: 500 10.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="952" height="320" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 01 · Eager In-Place Write vs. AOT Functionalization Copy-Back Overwrite</text>

  <!-- Panel 1: Eager -->
  <rect x="28" y="52" width="904" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="42" y="65" width="136" height="20" rx="4" fill="#059669"/>
  <text x="110" y="79" text-anchor="middle" class="badge" fill="#ffffff">EAGER MODE</text>
  <text x="42" y="106" class="mono">tap_pool = [0,0,0,0]</text>
  <line x1="214" y1="102" x2="256" y2="102" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-emerald)"/>
  <rect x="260" y="76" width="420" height="36" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="470" y="99" text-anchor="middle" class="sub">Tap.copy mutates self.pool directly -> writes [7, 7, 7, 7]</text>
  <line x1="680" y1="94" x2="722" y2="94" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-emerald)"/>
  <rect x="726" y="76" width="190" height="36" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="821" y="99" text-anchor="middle" class="mono" fill="#059669">Result: [7, 7, 7, 7]</text>

  <!-- Panel 2: AOT Bug -->
  <rect x="28" y="138" width="904" height="172" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <rect x="42" y="150" width="322" height="20" rx="4" fill="#e62b2b"/>
  <text x="203" y="164" text-anchor="middle" class="badge" fill="#ffffff">AOT FUNCTIONALIZATION: SIDE-CHANNEL WRITE BUG</text>

  <rect x="42" y="184" width="268" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="176" y="203" text-anchor="middle" class="label">1. Compiler Pre-Clone</text>
  <text x="176" y="220" text-anchor="middle" class="mono">writes_clone[0] = [0, 0, 0, 0]</text>

  <line x1="310" y1="206" x2="344" y2="206" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>

  <rect x="348" y="184" width="286" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="491" y="203" text-anchor="middle" class="label">2. Op Bypasses Arg via _SITES</text>
  <text x="491" y="220" text-anchor="middle" class="sub">self.pool=[7,7,7,7], writes_clone stays 0</text>

  <line x1="634" y1="206" x2="668" y2="206" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <rect x="672" y="184" width="244" height="44" rx="5" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="794" y="203" text-anchor="middle" class="label" fill="#b91c1c">3. Epilogue Copy-Back</text>
  <text x="794" y="220" text-anchor="middle" class="mono" fill="#b91c1c">tap_pool.copy_(writes_clone)</text>

  <rect x="42" y="244" width="874" height="48" rx="5" fill="#ffffff" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="479" y="273" text-anchor="middle" class="sub">Outcome: unmodified all-zero writes_clone[0] overwrites original tap_pool in the epilogue, resetting probes to [0, 0, 0, 0]</text>
</svg>
