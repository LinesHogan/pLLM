  <rect x="4" y="4" width="1032" height="288" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="188" height="24" rx="4" fill="#0047ab"/>
  <text x="114.0" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">BUG 4 · TOKEN VS REQ</text>
  <text x="220" y="33" class="title" fill="#111111">Bug 4: Decode (1 Req = 1 Token) Hid a Granularity Mix That Crashes on Prefill</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="64" width="456" height="208" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <text x="42" y="88" class="sec" fill="#111111">Why Did Decode Tests Pass?</text>
  <rect x="42" y="108" width="420" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="58" y="132" class="mono-sm" fill="#111111">Decode Batch: [Req A (1 tok), Req B (1 tok), Req C (1 tok)]</text>
  <text x="58" y="156" class="mono-sm" fill="#111111">num_tokens (3) == num_unique_requests (3)</text>
  <text x="42" y="212" class="sub" fill="#3f3f46">3 token rows happened to equal 3 unique requests, so</text>
  <text x="42" y="236" class="sub" fill="#3f3f46">`reshape(num_tokens)` succeeded by pure coincidence.</text>
  <rect x="504" y="64" width="512" height="208" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="522" y="88" class="sec" fill="#065f46">Prefill Batch: 3 Requests Expand to 5 + 1 + 6 = 12 Token Rows</text>
  <rect x="522" y="106" width="476" height="66" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="538" y="128" class="mono-sm" fill="#991b1b">Bug: query_unique_requests(batch) -> size [3]</text>
  <text x="538" y="150" class="mono-sm" fill="#991b1b">RuntimeError: shape [12] is invalid for input of size 3</text>
  <rect x="522" y="184" width="476" height="72" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="538" y="208" class="mono-sm" fill="#065f46">Fix: return slot_layers[:12]  # written per token row!</text>
  <text x="538" y="234" class="sub-sm" fill="#065f46">Read per-slot layer tags recorded during forward—works for any token count</text>
