  <rect x="4" y="4" width="952" height="190" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 04 · Request-Deduplicated select_states vs. Token-Expanded _slot_layers</text>

  <rect x="28" y="56" width="904" height="54" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="44" y="79" class="mono">Packed token rows (12 rows): [r0,r0,r0,r0,r0 | r1 | r2,r2,r2,r2,r2,r2]</text>
