<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="100%" role="img" aria-label="系统全景：有状态连续批处理引擎的一步流水线（以及四个排障点落位）">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="364" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="114" height="24" rx="4" fill="#0047ab"/>
  <text x="77.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">BIG PICTURE</text>
  <text x="146" y="33" class="title" fill="#111111">系统全景：有状态连续批处理引擎的一步流水线（以及四个排障点落位）</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="28" y="66" width="226" height="82" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="40" y="76" width="96" height="20" rx="3" fill="#0047ab"/>
  <text x="88" y="90" text-anchor="middle" class="badge" fill="#ffffff">1. Schedule</text>
  <text x="42" y="116" class="label" fill="#111111">请求准入编排</text>
  <text x="42" y="136" class="sub-sm" fill="#52525b">登记新进请求与词数</text>
  <line x1="254" y1="107" x2="278" y2="107" stroke="#0047ab" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="278" y="66" width="226" height="82" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="290" y="76" width="96" height="20" rx="3" fill="#0047ab"/>
  <text x="338" y="90" text-anchor="middle" class="badge" fill="#ffffff">2. Prepare</text>
  <text x="292" y="116" class="label" fill="#111111">前置导入与发版</text>
  <text x="292" y="136" class="sub-sm" fill="#52525b">状态更新 v0 -&gt; v1</text>
  <line x1="504" y1="107" x2="528" y2="107" stroke="#0047ab" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="528" y="66" width="226" height="82" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="540" y="76" width="96" height="20" rx="3" fill="#0047ab"/>
  <text x="588" y="90" text-anchor="middle" class="badge" fill="#ffffff">3. Forward</text>
  <text x="542" y="116" class="label" fill="#111111">混合批次前向</text>
  <text x="542" y="136" class="sub-sm" fill="#52525b">Prefill+Decode 拍平词表</text>
  <line x1="754" y1="107" x2="778" y2="107" stroke="#0047ab" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="778" y="66" width="226" height="82" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <rect x="790" y="76" width="96" height="20" rx="3" fill="#0047ab"/>
  <text x="838" y="90" text-anchor="middle" class="badge" fill="#ffffff">4. Export</text>
  <text x="792" y="116" class="label" fill="#111111">异步结果导出</text>
  <text x="792" y="136" class="sub-sm" fill="#52525b">拷出激活与层号元数据</text>
  <rect x="28" y="184" width="336" height="164" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="44" y="208" class="sec" fill="#991b1b">多版本状态池 (v0, v1 + 优化器页)</text>
  <rect x="44" y="222" width="304" height="50" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="56" y="242" class="label-sm" fill="#991b1b">BUG ① 准入快照拍早了 (Stage 1 vs 2)</text>
  <text x="56" y="260" class="sub-sm" fill="#52525b">先锁旧版 v0，后发布随批导入的 v1</text>
  <rect x="44" y="282" width="304" height="52" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="56" y="302" class="label-sm" fill="#991b1b">BUG ③ 优化器扁平页截断浮点数</text>
  <text x="56" y="320" class="sub-sm" fill="#52525b">首字段 int64 把同状态里的 0.5 截断成 0</text>
  <rect x="384" y="184" width="312" height="164" rx="6" fill="#fffbeb" stroke="#d99b26" stroke-width="1.5"/>
  <text x="400" y="208" class="sec" fill="#92400e">分页 KV Cache 与显存抢占循环</text>
  <rect x="400" y="222" width="280" height="112" rx="4" fill="#ffffff" stroke="#d99b26" stroke-width="1.2"/>
  <text x="412" y="244" class="label-sm" fill="#92400e">BUG ② 抢占重算篡改了历史 KV</text>
  <text x="412" y="266" class="sub-sm" fill="#52525b">前 10 词用 L2 生成 -&gt; 在线切到 L4 -&gt;</text>
  <text x="412" y="286" class="sub-sm" fill="#52525b">KV 满触发换出重算时，误用 L4 重算了前 10 词！</text>
  <text x="412" y="312" class="sub-sm" fill="#065f46">需区分：改写激活 vs 只读探针</text>
  <rect x="716" y="184" width="296" height="164" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="732" y="208" class="sec" fill="#991b1b">拍平词表 [12] vs 请求列表 [3]</text>
  <rect x="732" y="222" width="264" height="112" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="744" y="244" class="label-sm" fill="#991b1b">BUG ④ Prefill 多词导出形状报错</text>
  <text x="744" y="266" class="mono-sm" fill="#991b1b">shape [12] invalid for size 3</text>
  <text x="744" y="288" class="sub-sm" fill="#52525b">Decode 时 1 请求=1 词掩盖了粒度混用；</text>
  <text x="744" y="308" class="sub-sm" fill="#52525b">Prefill 展开成 5+1+6=12 词当场报错。</text>
  <line x1="196" y1="148" x2="196" y2="182" stroke="#e62b2b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="640" y1="148" x2="540" y2="182" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="890" y1="148" x2="864" y2="182" stroke="#e62b2b" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
