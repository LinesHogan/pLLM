<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" role="img" aria-label="GQA Grid Dispatch Comparison: 7:1 Head Packing vs. Window Regression">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="432" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <text x="28" y="34" class="title">GQA Grid Dispatch: 7:1 Head Packing vs. Window Regression</text>
  <text x="28" y="54" class="sub">Qwen2.5-0.5B (14 Query heads : 2 KV heads, 256 history tokens, 128 decode rows)</text>

  <!-- Panel 1: Full decode -->
  <rect x="28" y="70" width="864" height="136" rx="8" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="84" width="128" height="22" rx="4" fill="#059669"/>
  <text x="108" y="99" text-anchor="middle" class="badge" fill="#ffffff">16.6 µs · 1x READ</text>
  <text x="184" y="100" class="label">1. Full decode (2-KV-head grid — 7:1 GQA packing active)</text>

  <rect x="47" y="123" width="214" height="64" rx="6" fill="#111111"/>
  <rect x="44" y="120" width="214" height="64" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="151" y="146" text-anchor="middle" class="label">KV Head 0 in HBM</text>
  <text x="151" y="167" text-anchor="middle" class="sub">256 tokens · loaded once</text>

  <line x1="258" y1="152" x2="404" y2="152" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="331" y="141" text-anchor="middle" class="label" fill="#059669">1x HBM fetch to SRAM</text>

  <rect x="415" y="117" width="461" height="72" rx="6" fill="#111111"/>
  <rect x="412" y="114" width="461" height="72" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="430" y="136" class="label">Shared inside 1 Thread Block (CTA 0)</text>

  <rect x="430" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="457" y="166" text-anchor="middle" class="mono">Q0</text>
  <rect x="491" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="518" y="166" text-anchor="middle" class="mono">Q1</text>
  <rect x="552" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="579" y="166" text-anchor="middle" class="mono">Q2</text>
  <rect x="613" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="640" y="166" text-anchor="middle" class="mono">Q3</text>
  <rect x="674" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="701" y="166" text-anchor="middle" class="mono">Q4</text>
  <rect x="735" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="762" y="166" text-anchor="middle" class="mono">Q5</text>
  <rect x="796" y="147" width="54" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="823" y="166" text-anchor="middle" class="mono">Q6</text>

  <!-- Panel 2: Window decode -->
  <rect x="28" y="222" width="864" height="192" rx="8" fill="#fff1f2" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="236" width="146" height="22" rx="4" fill="#e62b2b"/>
  <text x="117" y="251" text-anchor="middle" class="badge" fill="#ffffff">91.5 µs · 5.5x SLOWER</text>
  <text x="202" y="252" class="label">2. Raw FA2 window decode (falls back to 14-Query-head grid — packing lost)</text>

  <rect x="47" y="299" width="214" height="64" rx="6" fill="#111111"/>
  <rect x="44" y="296" width="214" height="64" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="151" y="322" text-anchor="middle" class="label">KV Head 0 in HBM</text>
  <text x="151" y="343" text-anchor="middle" class="sub">Only 4 recent tokens (-98%)</text>

  <!-- Branching red arrows -->
  <path d="M 258 328 L 328 328" fill="none" stroke="#e62b2b" stroke-width="2"/>
  <path d="M 328 281 L 328 383" fill="none" stroke="#e62b2b" stroke-width="2"/>
  <line x1="328" y1="281" x2="404" y2="281" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="328" y1="315" x2="404" y2="315" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="328" y1="349" x2="404" y2="349" stroke="#e62b2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="328" y1="383" x2="404" y2="383" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- CTA boxes -->
  <rect x="412" y="268" width="160" height="26" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="492" y="286" text-anchor="middle" class="mono">CTA 0: Q0</text>

  <rect x="412" y="302" width="160" height="26" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="492" y="320" text-anchor="middle" class="mono">CTA 1: Q1</text>

  <rect x="412" y="336" width="160" height="26" rx="5" fill="#ffffff" stroke="#71717a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="492" y="354" text-anchor="middle" class="mono">... CTA 2..5</text>

  <rect x="412" y="370" width="160" height="26" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="492" y="388" text-anchor="middle" class="mono">CTA 6: Q6</text>

  <!-- Right callout -->
  <rect x="598" y="274" width="278" height="118" rx="6" fill="#ffffff" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="616" y="300" class="label" fill="#e62b2b">7 Separate CTAs Reload KV</text>
  <text x="616" y="324" class="sub">Same KV page fetched 7x from HBM</text>
  <text x="616" y="346" class="sub">Window savings lost to traffic</text>
  <text x="616" y="374" class="mono" fill="#e62b2b">16.6 µs -&gt; 91.5 µs (5.5x)</text>
</svg>
