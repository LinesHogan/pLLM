<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" width="100%" role="img" aria-label="修复方案：将探针拷贝拆为纯张量形参算子，并在执行当下同步写入层号标签">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="272" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="97" height="24" rx="4" fill="#059669"/>
  <text x="68.5" y="32" text-anchor="middle" class="badge" fill="#ffffff">CLEAN FIX</text>
  <text x="129" y="33" class="title" fill="#111111">修复方案：将探针拷贝拆为纯张量形参算子，并在执行当下同步写入层号标签</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="32" y="76" width="420" height="172" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <rect x="48" y="90" width="160" height="22" rx="4" fill="#111111"/>
  <text x="128" y="105" text-anchor="middle" class="label-sm" fill="#ffffff">1. 边界计算算子</text>
  <text x="48" y="136" class="mono" fill="#111111">run_hook(inputs, outputs, key)</text>
  <text x="48" y="162" class="sub" fill="#3f3f46">· 只把修改写进形参 outputs（残差与归一化输出）</text>
  <text x="48" y="186" class="sub" fill="#3f3f46">· 不再顺着 Python 对象属性偷偷触碰外部探针池</text>
  <text x="48" y="210" class="sub" fill="#065f46">· 克隆副本与真实修改完全一致</text>
  <line x1="452" y1="162" x2="508" y2="162" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="480" y="150" text-anchor="middle" class="mono-sm" fill="#065f46">normed</text>
  <rect x="512" y="76" width="496" height="172" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="528" y="90" width="184" height="22" rx="4" fill="#059669"/>
  <text x="620" y="105" text-anchor="middle" class="label-sm" fill="#ffffff">2. 显式张量拷贝算子</text>
  <text x="528" y="136" class="mono" fill="#065f46">probe_copy(normed, probe_pool, layer_tags, ...)</text>
  <text x="528" y="162" class="sub" fill="#065f46">· probe_pool 与 layer_tags 直接作为张量形参传入并原地写入</text>
  <text x="528" y="186" class="sub" fill="#065f46">· AOT 克隆形参 -&gt; 内核改克隆 -&gt; 尾声拷回原池，契约闭合</text>
  <text x="528" y="210" class="sub" fill="#065f46">· 仅当该层实际执行时才把 layer_id 写入标签（防跳层假标签）</text>
</svg>
