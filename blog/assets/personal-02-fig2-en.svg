<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 274" width="100%" role="img" aria-label="FIG 02 · Masked Full Evaluation (Option 2) vs. L2 Scalar Early-Exit Triton (Option 3)">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 700 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 700 12.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .muted { font: 500 10.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="952" height="266" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 02 · Masked Full Evaluation (Option 2) vs. L2 Scalar Early-Exit Triton (Option 3)</text>

  <!-- Option 2 -->
  <rect x="28" y="54" width="904" height="72" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <rect x="42" y="66" width="176" height="20" rx="4" fill="#e62b2b"/>
  <text x="130" y="80" text-anchor="middle" class="badge" fill="#ffffff">OPTION 2: COMPUTE + MASK</text>
  <text x="42" y="108" class="sub">All 28 candidate layers load HBM hidden &amp; weights for GEMM -> torch.where discards 27 inactive layers -> wastes bandwidth</text>

  <!-- Option 3 -->
  <rect x="28" y="138" width="904" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="42" y="150" width="224" height="20" rx="4" fill="#059669"/>
  <text x="154" y="164" text-anchor="middle" class="badge" fill="#ffffff">OPTION 3: L2 SCALAR EARLY-EXIT</text>

  <rect x="42" y="180" width="874" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="56" y="200" class="mono" fill="#059669">owners[row] == -1 (L2)</text>
  <text x="256" y="200" class="sub">-> First instruction exits immediately; zero HBM activation or parameter traffic</text>

  <rect x="42" y="216" width="874" height="30" rx="4" fill="#ffffff" stroke="#0047ab" stroke-width="1.2"/>
  <text x="56" y="236" class="mono" fill="#0047ab">owners[row] &gt;=  0 (L2)</text>
  <text x="256" y="236" class="sub">-> Active target layer loads bound parameter slot from HBM &amp; accumulates in place</text>
</svg>
