<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 556" width="100%" role="img" aria-label="单步一维时间轴与一致依赖折叠图">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="548" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="24" width="58" height="22" rx="4" fill="#111111"/>
  <text x="57" y="39" text-anchor="middle" class="badge" fill="#ffffff">FIG 01</text>
  <text x="98" y="41" class="title">单步一维时间轴与一致依赖折叠</text>
  <text x="28" y="64" class="sub">将全局刻度映射到 T = 8t + a 即可消去步数 t：无限展开的跨步循环坍缩为 8 锚点上的有限最长路图</text>

  <!-- Top Section: 1D Step Timeline -->
  <rect x="28" y="80" width="864" height="176" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <text x="44" y="103" class="badge" fill="#0047ab">1D STEP TIMELINE · 单步一维时间轴 (M = 8 个固定阶段锚点)</text>

  <!-- Row 1: Anchors 0..3 -->
  <rect x="48" y="118" width="182" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="139" y="135" text-anchor="middle" class="badge" fill="#0047ab">ANCHOR 0</text>
  <text x="139" y="153" text-anchor="middle" class="mono">request.prepare</text>

  <line x1="230" y1="141" x2="252" y2="141" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="256" y="118" width="182" height="46" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="347" y="135" text-anchor="middle" class="badge" fill="#0047ab">ANCHOR 1</text>
  <text x="347" y="153" text-anchor="middle" class="mono">model.execute</text>

  <line x1="438" y1="141" x2="460" y2="141" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="464" y="118" width="182" height="46" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="555" y="135" text-anchor="middle" class="badge" fill="#d99b26">ANCHOR 2</text>
  <text x="555" y="153" text-anchor="middle" class="mono">state.publish</text>

  <line x1="646" y1="141" x2="668" y2="141" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="672" y="118" width="182" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="763" y="135" text-anchor="middle" class="badge" fill="#0047ab">ANCHOR 3</text>
  <text x="763" y="153" text-anchor="middle" class="mono">sampler.pre_draw</text>

  <!-- Z-wrap connector from Anchor 3 to Anchor 4 -->
  <path d="M 763 164 L 763 177 L 139 177 L 139 186" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Row 2: Anchors 4..7 -->
  <rect x="48" y="190" width="182" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="139" y="207" text-anchor="middle" class="badge" fill="#0047ab">ANCHOR 4</text>
  <text x="139" y="225" text-anchor="middle" class="mono">sampler.complete</text>

  <line x1="230" y1="213" x2="252" y2="213" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="256" y="190" width="182" height="46" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="347" y="207" text-anchor="middle" class="badge" fill="#059669">ANCHOR 5</text>
  <text x="347" y="225" text-anchor="middle" class="mono">token.commit</text>

  <line x1="438" y1="213" x2="460" y2="213" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="464" y="190" width="182" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="555" y="207" text-anchor="middle" class="badge" fill="#0047ab">ANCHOR 6</text>
  <text x="555" y="225" text-anchor="middle" class="mono">request.finish</text>

  <line x1="646" y1="213" x2="668" y2="213" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="672" y="190" width="182" height="46" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="763" y="207" text-anchor="middle" class="badge" fill="#3f3f46">ANCHOR 7</text>
  <text x="763" y="225" text-anchor="middle" class="mono">next.prepare</text>

  <!-- Bottom Left Card: Unrolled Cross-Step Loop -->
  <rect x="28" y="274" width="402" height="256" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="298" class="label">无限展开的跨步循环</text>
  <text x="44" y="315" class="sub">Step t-k 到 Step t 的跨步与同步约束</text>

  <!-- Step t-k row -->
  <text x="44" y="357" class="mono" fill="#3f3f46">Step t-k</text>
  <rect x="129" y="335" width="124" height="44" rx="6" fill="#111111"/>
  <rect x="126" y="332" width="124" height="44" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="188" y="351" text-anchor="middle" class="label">写任务 u</text>
  <text x="188" y="368" text-anchor="middle" class="mono">@ a_u</text>

  <rect x="282" y="332" width="124" height="44" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="344" y="351" text-anchor="middle" class="label" fill="#3f3f46">读任务 v</text>
  <text x="344" y="368" text-anchor="middle" class="mono" fill="#3f3f46">@ a_v</text>

  <!-- Cross-step arrow u(t-k) -> v(t) -->
  <path d="M 188 376 L 188 402 L 344 402 L 344 430" fill="none" stroke="#e62b2b" stroke-width="1.9" marker-end="url(#arrow-red)"/>
  <rect x="177" y="390" width="178" height="22" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="266" y="405" text-anchor="middle" class="badge" fill="#e62b2b">跨 k 步发布 · 间隔 ≥ d</text>

  <!-- Step t row -->
  <text x="44" y="460" class="mono" fill="#111111">Step t</text>
  <rect x="126" y="434" width="124" height="44" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="188" y="453" text-anchor="middle" class="label">任务 u</text>
  <text x="188" y="470" text-anchor="middle" class="mono">@ a_u</text>

  <line x1="250" y1="456" x2="278" y2="456" stroke="#0047ab" stroke-width="1.9" marker-end="url(#arrow-blue)"/>

  <rect x="285" y="437" width="124" height="44" rx="6" fill="#111111"/>
  <rect x="282" y="434" width="124" height="44" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="344" y="453" text-anchor="middle" class="label">读任务 v</text>
  <text x="344" y="470" text-anchor="middle" class="mono">@ a_v</text>

  <!-- Intra-step caption cleanly below Step t row -->
  <rect x="168" y="492" width="196" height="22" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.2"/>
  <text x="266" y="507" text-anchor="middle" class="badge" fill="#0047ab">本步内约束 (k = 0, 间隔 ≥ d)</text>

  <!-- Middle Fold Arrow -->
  <text x="453" y="388" text-anchor="middle" class="badge" fill="#111111">折叠</text>
  <line x1="436" y1="402" x2="468" y2="402" stroke="#111111" stroke-width="2.4" marker-end="url(#arrow-ink)"/>

  <!-- Bottom Right Card: Folded Finite Uniform Graph -->
  <rect x="476" y="274" width="416" height="256" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="492" y="298" class="label">折叠后的有限一致依赖图</text>
  <rect x="492" y="308" width="384" height="24" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.2"/>
  <text x="684" y="324" text-anchor="middle" class="mono">a_v - a_u ≥ d - 8k   (步数 t 已完全消去)</text>

  <!-- Top edge u -> v -->
  <path d="M 578 394 C 578 354, 790 354, 790 390" fill="none" stroke="#0047ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="614" y="346" width="140" height="22" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.2"/>
  <text x="684" y="361" text-anchor="middle" class="mono" fill="#0047ab">边权: d - 0×8</text>

  <!-- Node u & Node v -->
  <rect x="521" y="397" width="120" height="48" rx="6" fill="#111111"/>
  <rect x="518" y="394" width="120" height="48" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="578" y="423" text-anchor="middle" class="label">任务 u</text>

  <rect x="733" y="397" width="120" height="48" rx="6" fill="#111111"/>
  <rect x="730" y="394" width="120" height="48" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="790" y="423" text-anchor="middle" class="label">任务 v</text>

  <!-- Bottom edge v -> u -->
  <path d="M 790 442 C 790 482, 578 482, 578 446" fill="none" stroke="#e62b2b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="614" y="468" width="140" height="22" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="684" y="483" text-anchor="middle" class="mono" fill="#e62b2b">边权: d - 8k</text>

  <text x="684" y="514" text-anchor="middle" class="sub">仅需 40 行最长路松弛求区间 [lo, hi] · 规划耗时回落微秒级</text>
</svg>
