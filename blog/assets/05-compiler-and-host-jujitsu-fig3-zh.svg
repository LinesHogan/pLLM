<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 344" width="100%" role="img" aria-label="10 行 make_fx 图手术前后对比：剪除末尾加法将 61,440 个多余内核归零">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", "Microsoft YaHei", monospace; letter-spacing: 0.04em; fill: #111111; }
    .red { fill: #e62b2b; }
    .blue { fill: #0047ab; }
    .green { fill: #059669; }
    .white { fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="336" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="66" height="22" rx="4" fill="#111111"/>
  <text x="61" y="37" text-anchor="middle" class="badge white">FIG 03</text>
  <text x="108" y="39" class="title">10 行 <tspan class="mono">make_fx</tspan> 图手术：剪除末尾加法，把 61,440 个多余内核归零</text>
  <line x1="28" y1="56" x2="892" y2="56" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Row 1: Before -->
  <rect x="28" y="72" width="864" height="116" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <rect x="44" y="84" width="256" height="24" rx="4" fill="#e62b2b"/>
  <text x="172" y="100" text-anchor="middle" class="badge white">手术前 · 65.8% 吞吐 (+61,440 内核)</text>
  <text x="876" y="100" text-anchor="end" class="sub red">多出 12,288 次 add + 49,152 次拷贝与清零</text>

  <rect x="44" y="124" width="76" height="42" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="82" y="149" text-anchor="middle" class="mono">x, y</text>

  <line x1="120" y1="145" x2="144" y2="145" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <rect x="148" y="118" width="206" height="54" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.5"/>
  <text x="251" y="140" text-anchor="middle" class="label">门控 / 投影子树</text>
  <text x="251" y="160" text-anchor="middle" class="sub">如 <tspan class="mono">gate * silu(y @ W)</tspan></text>

  <line x1="354" y1="145" x2="378" y2="145" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <rect x="382" y="118" width="232" height="54" rx="6" fill="#ffffff" stroke="#e62b2b" stroke-width="2"/>
  <text x="498" y="140" text-anchor="middle" class="label red">独立 BF16 add 写回显存</text>
  <text x="498" y="160" text-anchor="middle" class="mono">aten.add.Tensor</text>

  <line x1="614" y1="145" x2="638" y2="145" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <rect x="642" y="118" width="234" height="54" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <text x="759" y="140" text-anchor="middle" class="label"><tspan class="mono">rms_norm</tspan> 重读显存</text>
  <text x="759" y="160" text-anchor="middle" class="sub">单张量输入 · 错失原厂融合</text>

  <!-- Row 2: After -->
  <rect x="28" y="204" width="864" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
  <rect x="44" y="216" width="256" height="24" rx="4" fill="#059669"/>
  <text x="172" y="232" text-anchor="middle" class="badge white">手术后 · 99.5% 吞吐 (0 多余内核)</text>
  <text x="876" y="232" text-anchor="end" class="sub green">比特级舍入与原生一致（未增设二次加减）</text>

  <rect x="44" y="256" width="76" height="42" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="82" y="281" text-anchor="middle" class="mono">x, y</text>

  <line x1="120" y1="277" x2="144" y2="277" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <rect x="148" y="250" width="206" height="54" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.5"/>
  <text x="251" y="272" text-anchor="middle" class="label">门控 / 投影子树</text>
  <text x="251" y="292" text-anchor="middle" class="sub">左右分支操作数原样保留</text>

  <line x1="354" y1="277" x2="378" y2="277" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <rect x="382" y="250" width="232" height="54" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="498" y="272" text-anchor="middle" class="label green">剪除末尾加法根节点</text>
  <text x="498" y="292" text-anchor="middle" class="mono">吐出 (left, right)</text>

  <line x1="614" y1="277" x2="638" y2="277" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <rect x="645" y="253" width="234" height="54" rx="6" fill="#111111"/>
  <rect x="642" y="250" width="234" height="54" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="759" y="272" text-anchor="middle" class="label">原厂 <tspan class="mono blue">fused_add_rms_norm</tspan></text>
  <text x="759" y="292" text-anchor="middle" class="sub">寄存器内顺手完成加法与归一化</text>
</svg>
