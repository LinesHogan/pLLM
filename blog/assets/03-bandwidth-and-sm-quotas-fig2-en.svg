<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="100%" role="img" aria-label="Non-preemptive block scheduler comparison: 9,600 CTAs fill all 128 SMs and block main-stream GEMMs, whereas 32 persistent CTAs leave 96 SMs free for full-speed concurrency">
  <defs>
    <style>
      .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
      .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
      .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="468" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title">Non-Preemptive Block Scheduler: Why 32 Persistent CTAs Beat 9,600</text>
  <text x="32" y="59" class="sub">CUDA's block scheduler never preempts resident CTAs; cap slow I/O grids at SMs // 4 to avoid starving GEMMs</text>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Panel 1: 9,600 CTAs (Blocked) -->
  <rect x="35" y="93" width="856" height="172" rx="6" fill="#111111"/>
  <rect x="32" y="90" width="856" height="172" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <!-- Panel 1 Header Row -->
  <rect x="48" y="102" width="152" height="22" rx="4" fill="#e62b2b"/>
  <text x="124" y="117" text-anchor="middle" class="badge" fill="#ffffff">TRAP: 9,600 CTAs</text>
  <text x="212" y="118" class="label">naive_rows: side stream fills all 128 SMs</text>
  <rect x="656" y="102" width="216" height="22" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="764" y="117" text-anchor="middle" class="mono" fill="#e62b2b">6.19 ms (nearly serial)</text>

  <!-- Panel 1 SM Bar (8 cells = 128 SMs) -->
  <g transform="translate(48, 134)">
    <rect x="0" y="0" width="824" height="48" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
    <line x1="103" y1="0" x2="103" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="206" y1="0" x2="206" y2="48" stroke="#e62b2b" stroke-width="1.2"/>
    <line x1="309" y1="0" x2="309" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="412" y1="0" x2="412" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="515" y1="0" x2="515" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="618" y1="0" x2="618" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="721" y1="0" x2="721" y2="48" stroke="#e62b2b" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="51" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 0–15</text>
    <text x="154" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 16–31</text>
    <text x="257" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 32–47</text>
    <text x="360" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 48–63</text>
    <text x="463" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 64–79</text>
    <text x="566" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 80–95</text>
    <text x="669" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 96–111</text>
    <text x="772" y="19" text-anchor="middle" class="mono" fill="#e62b2b">SM 112–127</text>

    <text x="412" y="39" text-anchor="middle" class="sub" fill="#991b1b">All 128 SMs stalled waiting on 24 GB/s PCIe; Tensor Cores sit idle</text>
  </g>

  <!-- Panel 1 Blocked Bottom Row -->
  <rect x="48" y="194" width="212" height="52" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.4"/>
  <text x="154" y="216" text-anchor="middle" class="label">Main-Stream GEMMs</text>
  <text x="154" y="235" text-anchor="middle" class="mono">4×4096³ BF16 (3.88 ms)</text>

  <line x1="264" y1="220" x2="298" y2="220" stroke="#e62b2b" stroke-width="2" marker-end="url(#arrow-red)"/>

  <rect x="304" y="194" width="568" height="52" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="320" y="216" class="label" fill="#e62b2b">Block Scheduler: "All 128 slots occupied — wait outside."</text>
  <text x="320" y="235" class="sub">2.38 + 3.88 = 6.26 ms serial → 6.19 ms concurrent (0.07 ms hidden)</text>

  <!-- Panel 2: 32 Persistent CTAs (Concurrent) -->
  <rect x="35" y="281" width="856" height="172" rx="6" fill="#111111"/>
  <rect x="32" y="278" width="856" height="172" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <!-- Panel 2 Header Row -->
  <rect x="48" y="290" width="152" height="22" rx="4" fill="#059669"/>
  <text x="124" y="305" text-anchor="middle" class="badge" fill="#ffffff">CAPPED: 32 CTAs</text>
  <text x="212" y="306" class="label">bounded_rows: SMs // 4 quota, looping over tiles</text>
  <rect x="656" y="290" width="216" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="764" y="305" text-anchor="middle" class="mono" fill="#059669">4.00 ms (&gt;93% hidden)</text>

  <!-- Panel 2 SM Bar (25% left + 75% right, aligned vertically!) -->
  <g transform="translate(48, 322)">
    <!-- Left 32 SMs -->
    <rect x="0" y="0" width="204" height="54" rx="5" fill="#fefce8" stroke="#d99b26" stroke-width="1.75"/>
    <line x1="102" y1="0" x2="102" y2="54" stroke="#d99b26" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="102" y="21" text-anchor="middle" class="mono">SM 0–31 (25%)</text>
    <text x="102" y="42" text-anchor="middle" class="sub">Saturates 24 GB/s PCIe</text>

    <!-- Hard Partition Line -->
    <line x1="206" y1="-4" x2="206" y2="58" stroke="#111111" stroke-width="2.5"/>

    <!-- Right 96 SMs -->
    <rect x="208" y="0" width="616" height="54" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
    <line x1="311" y1="0" x2="311" y2="54" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="414" y1="0" x2="414" y2="54" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="517" y1="0" x2="517" y2="54" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="620" y1="0" x2="620" y2="54" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="723" y1="0" x2="723" y2="54" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="516" y="21" text-anchor="middle" class="mono" fill="#059669">SM 32–127 (96 SMs · 75% Compute Quota)</text>
    <text x="516" y="42" text-anchor="middle" class="sub">Main-stream Tensor Core 4×4096³ GEMMs run immediately at full speed</text>
  </g>

  <!-- Panel 2 Summary Row -->
  <rect x="48" y="388" width="824" height="46" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="460" y="408" text-anchor="middle" class="label" fill="#065f46">Complementary overlap: 1.64 ms solo gather + 3.88 ms GEMM → 4.00 ms concurrent</text>
  <text x="460" y="425" text-anchor="middle" class="sub">&gt;93% of PCIe transfer hidden (Rule: cap slow I/O grids at SMs // 4 to saturate the link)</text>
</svg>
