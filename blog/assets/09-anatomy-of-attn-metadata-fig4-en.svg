<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" role="img" aria-label="Upstream CPU 3-Integer Labeling &amp; Monotonic Frontier: Cross-Layer Routing">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="412" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="196" height="22" rx="4" fill="#111111"/>
  <text x="126" y="37" text-anchor="middle" class="badge" fill="#ffffff">FIG 04 · CPU 3-INT ROUTING</text>
  <text x="236" y="39" class="title">Upstream CPU 3-Integer Labeling &amp; Monotonic Frontier</text>
  <text x="28" y="64" class="sub">Example: prompt = 150, Steps 1–2 advanced frontier = 113; loop 0 &lt;= k &lt; scheduled with offset = computed + k</text>

  <!-- Timeline Container -->
  <rect x="31" y="85" width="864" height="118" rx="6" fill="#111111"/>
  <rect x="28" y="82" width="864" height="118" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <!-- Segment 1: 0..112 -->
  <rect x="44" y="98" width="406" height="44" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.5"/>
  <text x="247" y="125" text-anchor="middle" class="mono" fill="#0047ab">offset 0..112 (computed in Steps 1–2)</text>

  <!-- Segment 2: 113..148 -->
  <rect x="456" y="98" width="176" height="44" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.5"/>
  <text x="544" y="125" text-anchor="middle" class="mono">113..148 (Step 3)</text>

  <!-- Highlight 149: Prompt End -->
  <rect x="638" y="98" width="66" height="44" rx="6" fill="#059669" stroke="#111111" stroke-width="1.5"/>
  <text x="671" y="118" text-anchor="middle" class="mono" fill="#ffffff">149</text>
  <text x="671" y="134" text-anchor="middle" class="badge" fill="#ffffff">END</text>

  <!-- Segment 3: 150+ Decode -->
  <rect x="710" y="98" width="166" height="44" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.5"/>
  <text x="793" y="125" text-anchor="middle" class="mono" fill="#059669">150+ (Decode)</text>

  <!-- Frontier Marker Line -->
  <line x1="453" y1="90" x2="453" y2="152" stroke="#0047ab" stroke-width="2.2" stroke-dasharray="4 3"/>
  <rect x="395" y="154" width="116" height="22" rx="4" fill="#0047ab"/>
  <text x="453" y="169" text-anchor="middle" class="badge" fill="#ffffff">frontier = 113</text>

  <!-- Replay / Eviction Alert Bar under 0..63 -->
  <rect x="44" y="152" width="234" height="36" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="161" y="174" text-anchor="middle" class="mono" fill="#e62b2b">Evicted replay 0..63 (&lt; 113)</text>
  <line x1="278" y1="170" x2="316" y2="170" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="322" y="174" class="badge" fill="#e62b2b">RECOMPUTED</text>

  <!-- Three Rule Cards -->
  <!-- Card 1: Prompt End -->
  <rect x="31" y="221" width="274" height="140" rx="6" fill="#111111"/>
  <rect x="28" y="218" width="274" height="140" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <rect x="42" y="232" width="188" height="22" rx="4" fill="#059669"/>
  <text x="136" y="247" text-anchor="middle" class="badge" fill="#ffffff">RULE 01 · PROMPT END</text>
  <rect x="42" y="264" width="246" height="30" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="165" y="284" text-anchor="middle" class="mono">offset == prompt - 1</text>
  <text x="42" y="316" class="sub">Fires once at offset 149; ignores</text>
  <text x="42" y="338" class="sub">intermediate chunk tails (Steps 1–2)</text>

  <!-- Card 2: Latest Decode -->
  <rect x="326" y="221" width="274" height="140" rx="6" fill="#111111"/>
  <rect x="323" y="218" width="274" height="140" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="337" y="232" width="194" height="22" rx="4" fill="#0047ab"/>
  <text x="434" y="247" text-anchor="middle" class="badge" fill="#ffffff">RULE 02 · LATEST DECODE</text>
  <rect x="337" y="264" width="246" height="30" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="460" y="284" text-anchor="middle" class="mono">offset &gt;= prompt &amp;&amp; k == s-1</text>
  <text x="337" y="316" class="sub">Isolates newest generated token</text>
  <text x="337" y="338" class="sub">(s = scheduled) for state routing</text>

  <!-- Card 3: Preemption Replay -->
  <rect x="621" y="221" width="274" height="140" rx="6" fill="#111111"/>
  <rect x="618" y="218" width="274" height="140" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <rect x="632" y="232" width="204" height="22" rx="4" fill="#e62b2b"/>
  <text x="734" y="247" text-anchor="middle" class="badge" fill="#ffffff">RULE 03 · REPLAY FILTER</text>
  <rect x="632" y="264" width="246" height="30" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="755" y="284" text-anchor="middle" class="mono" fill="#e62b2b">offset &lt; frontier</text>
  <text x="632" y="316" class="sub">Evicted replay 0..63 falls below</text>
  <text x="632" y="338" class="sub">frontier (113) → marked RECOMPUTED</text>

  <!-- Footer -->
  <rect x="28" y="374" width="864" height="26" rx="4" fill="#f5f5f4"/>
  <text x="460" y="392" text-anchor="middle" class="sub">Source: InputBatch (scheduled, prompt, computed) before prepare_attn + monotonic frontier · ~30-line GIL-free Rust (~122 µs/step)</text>
</svg>
