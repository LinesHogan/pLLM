<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348" width="100%" role="img" aria-label="Silicon unit economics pull training and inference onto diverging tracks">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="340" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="24" width="60" height="22" rx="4" fill="#111111"/>
  <text x="58" y="39" text-anchor="middle" class="badge" fill="#ffffff">FIG 01</text>
  <rect x="96" y="24" width="236" height="22" rx="4" fill="#fefce8" stroke="#111111" stroke-width="1.2"/>
  <text x="214" y="39" text-anchor="middle" class="badge" fill="#111111">COMPUTE / BANDWIDTH &gt; 800:1</text>
  <text x="28" y="70" class="title">Flattening Silicon Cost Splits Training and Inference Economics</text>
  <line x1="28" y1="84" x2="892" y2="84" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Track 1: Training -->
  <rect x="31" y="105" width="128" height="96" rx="6" fill="#111111"/>
  <rect x="28" y="102" width="128" height="96" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="38" y="114" width="66" height="20" rx="4" fill="#0047ab"/>
  <text x="71" y="128" text-anchor="middle" class="badge" fill="#ffffff">TRAINING</text>
  <text x="38" y="156" class="label">Training Track</text>
  <text x="38" y="177" class="sub">Uniform scale pays</text>

  <line x1="156" y1="150" x2="174" y2="150" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="178" y="102" width="212" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="194" y="132" class="label">User Volume Grows</text>
  <text x="194" y="156" class="sub">Frontier model capability</text>
  <text x="194" y="175" class="sub">absorbs rising demand</text>

  <line x1="390" y1="150" x2="416" y2="150" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="420" y="102" width="212" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="436" y="132" class="label">Labs Pool Capital</text>
  <text x="436" y="156" class="sub">Concentrate capex into</text>
  <text x="436" y="175" class="sub">10x training clusters</text>

  <line x1="632" y1="150" x2="658" y2="150" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="665" y="105" width="228" height="96" rx="6" fill="#111111"/>
  <rect x="662" y="102" width="228" height="96" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="678" y="132" class="label">Uniform Scaling Pays</text>
  <text x="678" y="156" class="sub">Clean, uniform blocks</text>
  <text x="678" y="175" class="sub">still chase ceiling gains</text>

  <!-- Track 2: Inference -->
  <rect x="31" y="227" width="128" height="96" rx="6" fill="#111111"/>
  <rect x="28" y="224" width="128" height="96" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <rect x="38" y="236" width="76" height="20" rx="4" fill="#e62b2b"/>
  <text x="76" y="250" text-anchor="middle" class="badge" fill="#ffffff">INFERENCE</text>
  <text x="38" y="278" class="label">Inference Track</text>
  <text x="38" y="299" class="sub">Bandwidth bound</text>

  <line x1="156" y1="272" x2="174" y2="272" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <rect x="178" y="224" width="212" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="194" y="254" class="label">Token Price Sets Margin</text>
  <text x="194" y="278" class="sub">Per-million-token pricing</text>
  <text x="194" y="297" class="sub">dictates unit profit</text>

  <line x1="390" y1="272" x2="416" y2="272" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <rect x="420" y="224" width="212" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="436" y="254" class="label">Annual Price Cuts</text>
  <text x="436" y="278" class="sub">Silicon offers no free</text>
  <text x="436" y="297" class="sub">DRAM bandwidth gains</text>

  <line x1="632" y1="272" x2="658" y2="272" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <rect x="665" y="227" width="228" height="96" rx="6" fill="#111111"/>
  <rect x="662" y="224" width="228" height="96" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="678" y="254" class="label">Trade Purity for Bytes</text>
  <text x="678" y="278" class="sub">Return to dirty priors:</text>
  <text x="678" y="297" class="sub">N-gram · Reuse · Fast wts</text>
</svg>
