<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 388" width="100%" role="img" aria-label="固定形状路由表与空位吸收槽（Padding Sink）不对称读写架构图">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <clipPath id="left-box-clip">
      <rect x="28" y="86" width="282" height="268" rx="6"/>
    </clipPath>
  </defs>
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.04em; }
  </style>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="380" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Figure Header -->
  <text x="28" y="38" class="title">空位吸收槽 (Padding Sink)：用不对称路由表以一图应对变长批次</text>
  <rect x="726" y="21" width="166" height="22" rx="4" fill="#111111"/>
  <text x="809" y="36" text-anchor="middle" class="badge" fill="#ffffff">FIG 02 · PADDING SINK</text>

  <!-- Column Headers -->
  <text x="28" y="72" class="label">固定形状路由表 (满编 R = 128)</text>
  <text x="362" y="72" class="label">固定基地址状态池 (读 S+1 列 / 写 S 列)</text>

  <!-- Left Box: Routing Table -->
  <rect x="31" y="89" width="282" height="268" rx="6" fill="#111111"/>
  <g clip-path="url(#left-box-clip)">
    <rect x="28" y="86" width="282" height="96" fill="#ecfdf5"/>
    <rect x="28" y="182" width="282" height="172" fill="#fefce8"/>
  </g>
  <line x1="28" y1="182" x2="310" y2="182" stroke="#111111" stroke-width="1.75"/>
  <rect x="28" y="86" width="282" height="268" rx="6" fill="none" stroke="#111111" stroke-width="1.75"/>

  <!-- Left Top Zone -->
  <rect x="44" y="100" width="86" height="20" rx="4" fill="#059669"/>
  <text x="87" y="114" text-anchor="middle" class="badge" fill="#ffffff">ACTIVE = 1</text>
  <text x="142" y="114" class="label">行 0..29</text>
  <text x="44" y="142" class="mono">状态号 = 0..29</text>
  <text x="44" y="166" class="sub">本步 30 个在场活跃请求</text>

  <!-- Left Bottom Zone -->
  <rect x="44" y="198" width="86" height="20" rx="4" fill="#d99b26"/>
  <text x="87" y="212" text-anchor="middle" class="badge" fill="#ffffff">ACTIVE = 0</text>
  <text x="142" y="212" class="label">行 30..127 (空位)</text>
  <text x="44" y="242" class="mono">状态号统一填 S (哨兵槽)</text>
  <text x="44" y="268" class="mono" fill="#3f3f46">sources[..., S] = -1</text>
  <text x="44" y="292" class="mono" fill="#3f3f46">active_mask = 0.0</text>
  <text x="44" y="330" class="sub" fill="#71717a">无需按并发人数分档重录多张图</text>

  <!-- Routing Arrows -->
  <line x1="312" y1="134" x2="358" y2="134" stroke="#0047ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="312" y1="268" x2="358" y2="268" stroke="#e62b2b" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Right Top Card: Normal States -->
  <rect x="365" y="89" width="530" height="96" rx="6" fill="#111111"/>
  <rect x="362" y="86" width="530" height="96" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="380" y="112" class="label" fill="#0047ab">状态 0..29 — 正常读写映射</text>
  <text x="380" y="140" class="mono">读取 : sources[F, 0..S-1]      → pool[src]</text>
  <text x="380" y="164" class="mono">写回 : destinations[F, 0..S-1] → pool[dst]</text>

  <!-- Right Bottom Card: Padding Sink -->
  <rect x="365" y="199" width="530" height="158" rx="6" fill="#111111"/>
  <rect x="362" y="196" width="530" height="158" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <text x="380" y="222" class="label" fill="#e62b2b">状态 S — 空位吸收槽 (只读哨兵，零副作用)</text>

  <rect x="380" y="238" width="68" height="20" rx="4" fill="#111111"/>
  <text x="414" y="252" text-anchor="middle" class="badge" fill="#ffffff">读取段</text>
  <text x="460" y="253" class="sub"><tspan class="mono">sources[F, S+1]</tspan>：槽号填 -1，掩码读出全 0.0 (防 NaN)</text>

  <rect x="380" y="272" width="68" height="20" rx="4" fill="#0047ab"/>
  <text x="414" y="286" text-anchor="middle" class="badge" fill="#ffffff">求导段</text>
  <text x="460" y="287" class="sub"><tspan class="mono">loss * active</tspan>：权重为 0.0，对真实状态零梯度贡献</text>

  <rect x="380" y="306" width="68" height="20" rx="4" fill="#e62b2b"/>
  <text x="414" y="320" text-anchor="middle" class="badge" fill="#ffffff">写入段</text>
  <text x="460" y="321" class="sub"><tspan class="mono">destinations[F, S]</tspan>：无第 S 列，写内核直接跳过落盘</text>
</svg>
