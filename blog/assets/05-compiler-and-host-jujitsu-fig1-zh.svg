<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" role="img" aria-label="层间残差边界对比：教科书抽象与 vLLM 真实融合接缝">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", "Microsoft YaHei", monospace; letter-spacing: 0.04em; fill: #111111; }
    .red { fill: #e62b2b; }
    .blue { fill: #0047ab; }
    .green { fill: #059669; }
    .white { fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="382" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="66" height="22" rx="4" fill="#111111"/>
  <text x="61" y="37" text-anchor="middle" class="badge white">FIG 01</text>
  <text x="108" y="39" class="title">层间残差边界对比：教科书抽象 vs vLLM 真实计算图（全模型 2L + 1 处接缝）</text>
  <line x1="28" y1="56" x2="892" y2="56" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Left Panel: Textbook -->
  <rect x="28" y="72" width="372" height="290" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="86" width="166" height="26" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="127" y="103" text-anchor="middle" class="badge">教科书里的层间结构</text>

  <!-- Branch Box -->
  <rect x="126" y="128" width="216" height="42" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="234" y="154" text-anchor="middle" class="label">分支输出 <tspan class="mono">branch</tspan></text>

  <!-- Residual side input -->
  <rect x="42" y="198" width="92" height="36" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="88" y="220" text-anchor="middle" class="mono blue">residual</text>
  <line x1="134" y1="216" x2="154" y2="216" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Down arrow from branch to (+) -->
  <line x1="234" y1="170" x2="234" y2="192" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>

  <!-- (+) Add Node -->
  <rect x="158" y="195" width="152" height="42" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="234" y="221" text-anchor="middle" class="label red">(+) 残差相加</text>

  <!-- Down arrow from (+) to RMSNorm -->
  <line x1="234" y1="237" x2="234" y2="263" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <!-- RMSNorm Box -->
  <rect x="126" y="266" width="216" height="42" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="234" y="292" text-anchor="middle" class="label"><tspan class="mono">RMSNorm</tspan> 归一化</text>

  <text x="214" y="340" text-anchor="middle" class="sub">2 次显存往返 · 图内存在独立 + 节点</text>

  <!-- Right Panel: vLLM Actual -->
  <rect x="420" y="72" width="472" height="290" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="436" y="86" width="268" height="26" rx="4" fill="#111111"/>
  <text x="570" y="103" text-anchor="middle" class="badge white">vLLM 真实图 · 全模型 2L + 1 个边界</text>

  <!-- Unmerged inputs -->
  <rect x="444" y="128" width="202" height="44" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="545" y="155" text-anchor="middle" class="label">分支输出 <tspan class="mono">branch</tspan></text>

  <rect x="666" y="128" width="202" height="44" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.75"/>
  <text x="767" y="155" text-anchor="middle" class="label">主干残差 <tspan class="mono blue">residual</tspan></text>

  <!-- Converging arrows -->
  <path d="M 545 172 L 545 192 L 656 192 L 656 212" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <path d="M 767 172 L 767 192 L 656 192" fill="none" stroke="#0047ab" stroke-width="1.8"/>

  <!-- Seam callout pill -->
  <rect x="570" y="179" width="172" height="22" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="656" y="194" text-anchor="middle" class="badge green">接缝处两路完好交汇</text>

  <!-- Fused Op Box with hard offset shadow -->
  <rect x="445" y="218" width="426" height="66" rx="6" fill="#111111"/>
  <rect x="442" y="215" width="426" height="66" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="655" y="242" text-anchor="middle" class="mono">fused_add_rms_norm(branch, residual)</text>
  <text x="655" y="266" text-anchor="middle" class="sub">单次显存往返：同时吐出 <tspan class="mono">normed_x</tspan> 与新 <tspan class="mono">residual</tspan></text>

  <!-- Output arrows -->
  <line x1="552" y1="281" x2="552" y2="305" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="760" y1="281" x2="760" y2="305" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Output pills -->
  <rect x="454" y="308" width="196" height="36" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="552" y="330" text-anchor="middle" class="label">归一化输入 <tspan class="mono">normed_x</tspan></text>

  <rect x="662" y="308" width="196" height="36" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="760" y="330" text-anchor="middle" class="label">新残差 <tspan class="mono blue">new residual</tspan></text>
</svg>
