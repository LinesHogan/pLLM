<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 146" width="100%" role="img" aria-label="FIG 01 · 方案一（CUDA 条件子图）的工作区显存乘法膨胀">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 700 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 700 12.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .muted { font: 500 10.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="952" height="138" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 01 · 方案一（CUDA 条件子图）的工作区显存乘法膨胀</text>
  <rect x="28" y="56" width="260" height="68" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.4"/>
  <text x="158" y="84" text-anchor="middle" class="label">多档批大小捕获图</text>
  <text x="158" y="106" text-anchor="middle" class="mono">(1, 2, 4, ..., 256)</text>

  <text x="308" y="96" text-anchor="middle" class="title">×</text>

  <rect x="328" y="56" width="236" height="68" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.4"/>
  <text x="446" y="84" text-anchor="middle" class="label">28 个候选层 IF 条件子图</text>
  <text x="446" y="106" text-anchor="middle" class="sub">每层独立分支与 cuBLAS 句柄</text>

  <line x1="564" y1="90" x2="600" y2="90" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <rect x="604" y="56" width="328" height="68" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.6"/>
  <text x="768" y="84" text-anchor="middle" class="label" fill="#b91c1c">累计工作区突破 > 256 MiB 预算</text>
  <text x="768" y="106" text-anchor="middle" class="sub">挤压可用 KV Cache 容量，难以服务高并发</text>
</svg>
