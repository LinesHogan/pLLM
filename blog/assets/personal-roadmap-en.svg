  <text x="73" y="227" text-anchor="middle" class="badge" fill="#ffffff">LAYER 3</text>
  <text x="122" y="228" class="label" fill="#111111">IEEE 754 &amp; Tensor Parallelism</text>
  <line x1="324" y1="223" x2="354" y2="223" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="358" y="198" width="658" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="211" width="44" height="24" rx="4" fill="#111111"/>
  <text x="392" y="227" text-anchor="middle" class="badge" fill="#ffffff">[03]</text>
  <text x="426" y="228" class="sub" fill="#3f3f46">Why algebraically identical Triton and PyTorch paths diverge on [2048,0] and TP&gt;1 scaling</text>
  <line x1="174" y1="248" x2="174" y2="264" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-ink)"/>
