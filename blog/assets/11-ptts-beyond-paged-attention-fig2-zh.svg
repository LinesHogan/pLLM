<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" width="100%" role="img" aria-label="PTTS 在分块快权重、动态切层与前缀缓存分析中的三项系统友好机制">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="428" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <text x="28" y="34" class="title">FIG 02 · 同一套槽号描述符原语支撑三类差异显著的系统机制</text>
  <text x="28" y="54" class="sub">版本根只记录整数槽号，因此字段共享、跨层路由与静态 KV 因果分析都可以转成元数据操作</text>

  <!-- Band 1: Chunked TTT Carry -->
  <rect x="28" y="76" width="864" height="104" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="44" y="90" width="184" height="24" rx="4" fill="#059669"/>
  <text x="136" y="106" text-anchor="middle" class="badge" fill="#ffffff">1. 分块快权重槽位沿用</text>
  <text x="44" y="136" class="sub">In-Place TTT 解码步</text>
  <text x="44" y="158" class="mono">changed == False</text>

  <rect x="246" y="96" width="190" height="64" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="260" y="122" class="label">版本 v_t</text>
  <text x="260" y="144" class="mono">(w_base=#0, delta=#4)</text>

  <line x1="436" y1="128" x2="508" y2="128" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <text x="472" y="118" text-anchor="middle" class="sub">沿用槽号</text>

  <rect x="512" y="96" width="190" height="64" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="526" y="122" class="label">版本 v_{t+1}</text>
  <text x="526" y="144" class="mono">(w_base=#0, delta=#4)</text>

  <text x="720" y="122" class="sub">前 1023 步零页分配</text>
  <text x="720" y="144" class="sub">省去 570 MiB/req 拷贝</text>

  <!-- Band 2: LayerRoute -->
  <rect x="28" y="196" width="864" height="104" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.6"/>
  <rect x="44" y="210" width="184" height="24" rx="4" fill="#0047ab"/>
  <text x="136" y="226" text-anchor="middle" class="badge" fill="#ffffff">2. 物理层号与槽位解耦</text>
  <text x="44" y="256" class="sub">LayerRoute 动态切层</text>
  <text x="44" y="278" class="mono">over = (4, 12, 20)</text>

  <rect x="246" y="216" width="190" height="64" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="260" y="242" class="label">单份参数与控制槽</text>
  <text x="260" y="264" class="mono">layer=20, vec=槽#2</text>

  <line x1="436" y1="248" x2="508" y2="248" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="472" y="238" text-anchor="middle" class="sub">L2 判定</text>

  <rect x="512" y="216" width="190" height="64" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="526" y="242" class="label">第 4, 12 层早退返回</text>
  <text x="526" y="264" class="label">第 20 层读写 槽#2</text>

  <text x="720" y="242" class="sub">单份参数显存 O(1)</text>
  <text x="720" y="264" class="sub">在线切层无需重录图</text>

  <!-- Band 3: Causal Split -->
  <rect x="28" y="316" width="864" height="96" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.6"/>
  <rect x="44" y="330" width="184" height="24" rx="4" fill="#111111"/>
  <text x="136" y="346" text-anchor="middle" class="badge" fill="#ffffff">3. 静态因果读写划分</text>
  <text x="44" y="376" class="sub">构建期区分状态用途</text>
  <text x="44" y="396" class="mono">explain 静态判定</text>

  <rect x="246" y="332" width="296" height="64" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="260" y="356" class="mono">model_reads \ kv_model_reads</text>
  <text x="260" y="378" class="sub">纯探针读取：兼容前缀缓存与抢占无损重算</text>

  <rect x="562" y="332" width="312" height="64" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="576" y="356" class="mono">kv_model_reads (含在线改写)</text>
  <text x="576" y="378" class="sub">改写主干 KV：关闭前缀缓存，抢占回退或显式报错</text>
</svg>
