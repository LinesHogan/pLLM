<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 202" width="100%" role="img" aria-label="FIG 01 · IEEE 754 float16 Grid Spacing on [2048, 4096) (ULP = 2.0) &amp; Ties-to-Even">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 700 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 700 12.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .muted { font: 500 10.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="952" height="194" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 01 · IEEE 754 float16 Grid Spacing on [2048, 4096) (ULP = 2.0) &amp; Ties-to-Even</text>
  <text x="28" y="54" class="sub">With 10 mantissa bits, adjacent FP16 values sit 2.0 apart; midpoint 2049.0 rounds to even mantissa LSB (2048.0)</text>

  <line x1="68" y1="98" x2="892" y2="98" stroke="#111111" stroke-width="2"/>
  <line x1="140" y1="84" x2="140" y2="112" stroke="#0047ab" stroke-width="2.5"/>
  <text x="140" y="76" text-anchor="middle" class="mono" fill="#0047ab">2048.0 (LSB=0)</text>

  <line x1="390" y1="84" x2="390" y2="112" stroke="#111111" stroke-width="2.5"/>
  <text x="390" y="76" text-anchor="middle" class="mono">2050.0 (LSB=1)</text>

  <line x1="640" y1="84" x2="640" y2="112" stroke="#0047ab" stroke-width="2.5"/>
  <text x="640" y="76" text-anchor="middle" class="mono" fill="#0047ab">2052.0 (LSB=0)</text>

  <line x1="840" y1="84" x2="840" y2="112" stroke="#111111" stroke-width="2.5"/>
  <text x="840" y="76" text-anchor="middle" class="mono">2054.0 (LSB=1)</text>

  <!-- Midpoint 2049.0 -->
  <circle cx="265" cy="98" r="5.5" fill="#e62b2b"/>
  <path d="M 265 106 L 265 132 L 152 132" fill="none" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <rect x="120" y="142" width="720" height="40" rx="5" fill="#fefce8" stroke="#111111" stroke-width="1.3"/>
  <text x="480" y="167" text-anchor="middle" class="sub">Sequential FP16: (2048 + 1) = 2049.0 -> rounds back to 2048.0 (+1 absorbed); Fused FP32: (2048 + 1 + 1) = 2050.0</text>
</svg>
