<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 532" width="100%" role="img" aria-label="Nsight Systems Multi-Stream Physical Contention Comparison">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="524" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="24" width="58" height="22" rx="4" fill="#111111"/>
  <text x="57" y="39" text-anchor="middle" class="badge" fill="#ffffff">FIG 02</text>
  <text x="98" y="41" class="title">Two Faces of Multi-Stream Concurrency on Silicon</text>
  <text x="28" y="64" class="sub">Overlap only wins when streams use complementary hardware; fighting over the same bus or barrier slows both</text>

  <!-- CASE A Panel -->
  <rect x="28" y="80" width="864" height="206" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="94" width="64" height="20" rx="4" fill="#e62b2b"/>
  <text x="76" y="108" text-anchor="middle" class="badge" fill="#ffffff">CASE A</text>
  <text x="118" y="109" class="label">Unfenced Early Side Launch (1 GPU) — VRAM Bus Collision</text>

  <!-- Case A Main Stream -->
  <text x="44" y="158" class="label">Main stream</text>
  <text x="44" y="174" class="sub">decode path</text>

  <rect x="196" y="138" width="194" height="44" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="293" y="165" text-anchor="middle" class="label">Model Forward</text>

  <line x1="390" y1="160" x2="412" y2="160" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="416" y="138" width="286" height="44" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="559" y="157" text-anchor="middle" class="label">Sampler Sweeping Logits</text>
  <text x="559" y="174" text-anchor="middle" class="mono">80 MB vocab buffer (peak BW)</text>

  <!-- Collision indicator -->
  <line x1="552" y1="186" x2="552" y2="220" stroke="#e62b2b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
  <line x1="566" y1="224" x2="566" y2="190" stroke="#e62b2b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arrow-red)"/>
  <rect x="466" y="194" width="186" height="22" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.2"/>
  <text x="559" y="209" text-anchor="middle" class="badge" fill="#e62b2b">GDDR / HBM BUS CONTENTION</text>

  <!-- Case A Side Stream -->
  <text x="44" y="246" class="label">Side stream</text>
  <text x="44" y="262" class="sub">online update</text>

  <line x1="196" y1="248" x2="404" y2="248" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="416" y1="224" x2="416" y2="274" stroke="#e62b2b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="342" y="241" text-anchor="middle" class="badge" fill="#e62b2b">fence removed</text>

  <rect x="419" y="229" width="268" height="44" rx="6" fill="#111111"/>
  <rect x="416" y="226" width="268" height="44" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.9"/>
  <text x="550" y="245" text-anchor="middle" class="label">Early Train Copy + AdamW</text>
  <text x="550" y="262" text-anchor="middle" class="sub" fill="#e62b2b">collides with sampler sweep</text>

  <!-- Case A Result Box -->
  <rect x="720" y="144" width="156" height="118" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="798" y="170" text-anchor="middle" class="badge" fill="#e62b2b">OUTCOME</text>
  <text x="798" y="194" text-anchor="middle" class="label">Bus Saturated</text>
  <text x="798" y="216" text-anchor="middle" class="sub">tail shrank to 8 μs</text>
  <text x="798" y="240" text-anchor="middle" class="label" fill="#e62b2b">Net TPS drops ~2%</text>

  <!-- CASE B Panel -->
  <rect x="28" y="302" width="864" height="206" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="316" width="64" height="20" rx="4" fill="#059669"/>
  <text x="76" y="330" text-anchor="middle" class="badge" fill="#ffffff">CASE B</text>
  <text x="118" y="331" class="label">Multi-GPU TP &gt; 1 with Stream Priority — Riding Inter-GPU Wait Gaps</text>

  <!-- Case B Main Stream -->
  <text x="44" y="376" class="label">Main stream</text>
  <text x="44" y="393" class="mono" fill="#0047ab">priority = -1</text>

  <rect x="196" y="358" width="128" height="44" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="260" y="385" text-anchor="middle" class="label">Layer GEMM</text>

  <line x1="324" y1="380" x2="344" y2="380" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="348" y="358" width="224" height="44" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="460" y="377" text-anchor="middle" class="mono">Custom All-Reduce</text>
  <text x="460" y="394" text-anchor="middle" class="sub">NVLink / PCIe barrier</text>

  <line x1="572" y1="380" x2="592" y2="380" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="596" y="358" width="106" height="44" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="649" y="385" text-anchor="middle" class="label">Next Layer</text>

  <!-- Window indicator -->
  <line x1="348" y1="406" x2="348" y2="444" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="572" y1="406" x2="572" y2="444" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="374" y="414" width="172" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="460" y="429" text-anchor="middle" class="badge" fill="#059669">INTER-GPU WAIT WINDOW</text>

  <!-- Case B Side Stream -->
  <text x="44" y="466" class="label">Side stream</text>
  <text x="44" y="483" class="mono" fill="#059669">priority = 0</text>

  <line x1="196" y1="468" x2="348" y2="468" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="351" y="449" width="224" height="44" rx="6" fill="#111111"/>
  <rect x="348" y="446" width="224" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.9"/>
  <text x="460" y="465" text-anchor="middle" class="label">Local Replicated Update</text>
  <text x="460" y="482" text-anchor="middle" class="sub" fill="#059669">never delays TP barrier</text>

  <line x1="572" y1="468" x2="702" y2="468" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Case B Result Box -->
  <rect x="720" y="364" width="156" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
  <text x="798" y="390" text-anchor="middle" class="badge" fill="#059669">OUTCOME</text>
  <text x="798" y="414" text-anchor="middle" class="label">Zero Collision</text>
  <text x="798" y="436" text-anchor="middle" class="sub">Native TP share:</text>
  <text x="798" y="460" text-anchor="middle" class="mono" fill="#059669">87% → 97.6%</text>
</svg>
