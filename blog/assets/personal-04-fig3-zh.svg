<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 288" width="100%" role="img" aria-label="问题三：融合 AdamW 扁平参数页直接继承第 0 个字段的 int64 类型，把 0.5 截断成 0">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="280" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="220" height="24" rx="4" fill="#e62b2b"/>
  <text x="130.0" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">BUG 3 · DTYPE TRUNCATION</text>
  <text x="252" y="33" class="title" fill="#111111">问题三：融合 AdamW 扁平参数页直接继承第 0 个字段的 int64 类型，把 0.5 截断成 0</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="64" width="480" height="202" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="42" y="88" class="sec" fill="#065f46">不挂优化器：每个字段独立建池，各自保留原类型</text>
  <rect x="42" y="108" width="444" height="46" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="58" y="136" class="mono-sm" fill="#111111">Pool 0 -> layer: int64 = 4</text>
  <rect x="42" y="166" width="444" height="46" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="58" y="194" class="mono-sm" fill="#065f46">Pool 1 -> lora_a: float32 = [0.5, 0.5, ...]  (OK)</text>
  <text x="42" y="242" class="sub-sm" fill="#065f46">互不干扰，单测不挂 AdamW 时一切正常</text>
  <rect x="532" y="64" width="484" height="202" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="550" y="88" class="sec" fill="#991b1b">挂上融合 AdamW：所有字段拍成一维扁平页</text>
  <rect x="550" y="108" width="448" height="54" rx="4" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="566" y="130" class="mono-sm" fill="#991b1b">flat_page.dtype = fields[0].dtype  # -> int64!!</text>
  <text x="566" y="150" class="mono-sm" fill="#991b1b">[ layer=4 | int64(0.5)->0 | int64(0.5)->0 ]</text>
  <text x="550" y="190" class="sub" fill="#991b1b">为了一次内核更新全部参数，底层直接取首字段 dtype 建整页；</text>
  <text x="550" y="214" class="sub" fill="#991b1b">离散 int64 根本不可微 -&gt; 声明期直接禁止离散控制状态挂优化器。</text>
</svg>
