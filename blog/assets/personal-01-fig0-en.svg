<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 332" width="100%" role="img" aria-label="Big Picture: Attaching a Layer Probe Inside a torch.compile(fullgraph=True) Model">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="324" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="114" height="24" rx="4" fill="#0047ab"/>
  <text x="77.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">BIG PICTURE</text>
  <text x="146" y="33" class="title" fill="#111111">Big Picture: Attaching a Layer Probe Inside a torch.compile(fullgraph=True) Model</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="128" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="40" y="82" class="sec" fill="#1e3a8a">torch.compile(..., fullgraph=True) Graph Boundary (traces Tensors only, not arbitrary Python objects)</text>
  <rect x="44" y="100" width="170" height="68" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="129" y="128" text-anchor="middle" class="label" fill="#111111">Transformer Layer l-1</text>
  <text x="129" y="148" text-anchor="middle" class="sub-sm" fill="#52525b">Produces hidden state h</text>
  <line x1="214" y1="134" x2="254" y2="134" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="258" y="100" width="186" height="68" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="351" y="128" text-anchor="middle" class="label" fill="#111111">RMSNorm Boundary</text>
  <text x="351" y="148" text-anchor="middle" class="mono-sm" fill="#111111">(normed, residual)</text>
  <line x1="444" y1="134" x2="484" y2="134" stroke="#0047ab" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <rect x="488" y="96" width="276" height="76" rx="5" fill="#dbeafe" stroke="#0047ab" stroke-width="1.8"/>
  <text x="626" y="120" text-anchor="middle" class="mono" fill="#1e3a8a">@custom_op("run_hook")</text>
  <text x="626" y="140" text-anchor="middle" class="sub-sm" fill="#1e3a8a">Goal: 1. Edit outputs   2. Copy hidden state to pool</text>
  <text x="626" y="158" text-anchor="middle" class="mono-sm" fill="#1e3a8a">mutates_args={"outputs", "writes"}</text>
  <line x1="764" y1="134" x2="804" y2="134" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="808" y="100" width="186" height="68" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="901" y="128" text-anchor="middle" class="label" fill="#111111">Transformer Layer l</text>
  <text x="901" y="148" text-anchor="middle" class="sub-sm" fill="#52525b">Continues forward pass</text>
  <rect x="140" y="216" width="360" height="92" rx="6" fill="#fef3c7" stroke="#d99b26" stroke-width="1.5"/>
  <text x="320" y="240" text-anchor="middle" class="label" fill="#92400e">External Python Dict REGISTRY[key]</text>
  <text x="320" y="262" text-anchor="middle" class="sub-sm" fill="#92400e">Holds stateful Python Hook instances</text>
  <text x="320" y="284" text-anchor="middle" class="mono-sm" fill="#92400e">hook_obj.pool -> Tensor</text>
  <rect x="570" y="216" width="380" height="92" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="240" text-anchor="middle" class="label" fill="#065f46">External GPU Buffer probe_pool [slots, d]</text>
  <text x="760" y="262" text-anchor="middle" class="sub-sm" fill="#065f46">Goal: Read captured layer-l hidden states after forward</text>
  <text x="760" y="284" text-anchor="middle" class="label-sm" fill="#e62b2b">Symptom: [7,7,7,7] in Eager, [0,0,0,0] when compiled!</text>
  <path d="M 570 172 L 570 198 L 320 198 L 320 214" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <line x1="500" y1="262" x2="568" y2="262" stroke="#e62b2b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
</svg>
