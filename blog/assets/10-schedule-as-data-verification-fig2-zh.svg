<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 506" width="100%" role="img" aria-label="百万加盐蜕变对照：锁死批次形状 [51, Hidden]，精准锁定跨行串味方法">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="498" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="196" height="22" rx="4" fill="#111111"/>
  <text x="126" y="37" text-anchor="middle" class="badge" fill="#ffffff">MILLION-SALT PERTURBATION</text>
  <text x="236" y="38" class="sub">固定 [51, Hidden] 批次形状与行序，杜绝形状分支误导</text>
  <text x="28" y="68" class="title">百万加盐蜕变对照：在方法入口与出口精准锁定跨租户串味</text>

  <!-- Deterministic Seed Formula Bar -->
  <rect x="28" y="84" width="864" height="38" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <text x="44" y="108" class="label">激活初值公式：</text>
  <text x="148" y="108" class="mono">activation = salt + 10000 * 请求内序号 + 100 * 词位置 + 通道号</text>

  <!-- RUN 1: Baseline -->
  <rect x="31" y="139" width="864" height="62" rx="6" fill="#111111"/>
  <rect x="28" y="136" width="864" height="62" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="42" y="154" width="136" height="26" rx="4" fill="#111111"/>
  <text x="110" y="171" text-anchor="middle" class="badge" fill="#ffffff">RUN 1 · 基准组</text>

  <rect x="192" y="144" width="426" height="46" rx="5" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="405" y="163" text-anchor="middle" class="label">邻居 req_b（行 0..49）</text>
  <text x="405" y="181" text-anchor="middle" class="mono">salt = 0</text>

  <text x="630" y="172" text-anchor="middle" class="label">+</text>

  <rect x="642" y="144" width="236" height="46" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="163" text-anchor="middle" class="label">目标 req_a（行 50）</text>
  <text x="760" y="181" text-anchor="middle" class="mono" fill="#059669">salt = 0</text>

  <!-- RUN 2: Salted -->
  <rect x="31" y="215" width="864" height="62" rx="6" fill="#111111"/>
  <rect x="28" y="212" width="864" height="62" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="42" y="230" width="136" height="26" rx="4" fill="#d99b26"/>
  <text x="110" y="247" text-anchor="middle" class="badge" fill="#111111">RUN 2 · 加盐组</text>

  <rect x="192" y="220" width="426" height="46" rx="5" fill="#fefce8" stroke="#d99b26" stroke-width="2"/>
  <text x="405" y="239" text-anchor="middle" class="label">邻居 req_b（行 0..49）</text>
  <text x="405" y="257" text-anchor="middle" class="mono" fill="#e62b2b">salt = 1,000,000（+10⁶ 扰动）</text>

  <text x="630" y="248" text-anchor="middle" class="label">+</text>

  <rect x="642" y="220" width="236" height="46" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="239" text-anchor="middle" class="label">目标 req_a（行 50）</text>
  <text x="760" y="257" text-anchor="middle" class="mono" fill="#059669">salt = 0（输入不变）</text>

  <!-- Flow Connector to Hook Entry -->
  <path d="M 760 278 L 760 297 L 154 297 L 154 316" fill="none" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="276" y="285" width="368" height="22" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="460" y="300" text-anchor="middle" class="sub">两遍张量形状同为 [51, Hidden]，逐个挂载点比对 req_a 切片</text>

  <!-- 3-Box Hook Pipeline -->
  <!-- Box 1: Hook Entry -->
  <rect x="28" y="320" width="253" height="102" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
  <rect x="44" y="334" width="114" height="22" rx="4" fill="#059669"/>
  <text x="101" y="349" text-anchor="middle" class="badge" fill="#ffffff">1. 方法入口比对</text>
  <text x="44" y="377" class="mono">req_a(Run1) == req_a(Run2)</text>
  <text x="44" y="401" class="sub">进入方法前切片完全一致（Δ = 0）</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="283" y1="371" x2="309" y2="371" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Box 2: User Hook -->
  <rect x="316" y="323" width="292" height="102" rx="6" fill="#111111"/>
  <rect x="313" y="320" width="292" height="102" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="329" y="334" width="114" height="22" rx="4" fill="#111111"/>
  <text x="386" y="349" text-anchor="middle" class="badge" fill="#ffffff">2. 待测用户方法</text>
  <text x="329" y="377" class="mono">h - h.mean(dim=0, keepdim=True)</text>
  <text x="329" y="399" class="sub">跨行求平均：把行 0..49 的百万盐值</text>
  <text x="329" y="414" class="sub">直接污染进第 50 行的 req_a</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="607" y1="371" x2="633" y2="371" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- Box 3: Hook Exit -->
  <rect x="640" y="323" width="255" height="102" rx="6" fill="#111111"/>
  <rect x="637" y="320" width="255" height="102" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <rect x="653" y="334" width="114" height="22" rx="4" fill="#e62b2b"/>
  <text x="710" y="349" text-anchor="middle" class="badge" fill="#ffffff">3. 方法出口比对</text>
  <text x="653" y="377" class="mono" fill="#e62b2b">req_a(Run1) != req_a(Run2)</text>
  <text x="653" y="399" class="sub">输出切片漂移 (&gt; 1e-6)</text>
  <text x="653" y="414" class="label" fill="#e62b2b">当场锁定该方法内部跨行串味！</text>

  <!-- Bottom Diagnosis Strip -->
  <rect x="28" y="438" width="864" height="40" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.5"/>
  <text x="460" y="463" text-anchor="middle" class="label">诊断规则：入口一致 + 出口漂移 ⇒ 用户方法内部跨行泄漏   |   入口即漂移 ⇒ 上游框架行路由异常</text>
</svg>
