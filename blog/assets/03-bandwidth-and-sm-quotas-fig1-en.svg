<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 352" width="100%" role="img" aria-label="Hardware quota map of one concurrent decode step showing Channel A slow PCIe link and Channel B local VRAM weight bus">
  <defs>
    <style>
      .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
      .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
      .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="344" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title">Hardware Quota Map of One Concurrent Decode Step</text>
  <text x="32" y="59" class="sub">Two shared quotas govern step time: non-preemptive SM slots &amp; whole-layer weight bandwidth</text>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Left Node: Pinned Host RAM -->
  <rect x="35" y="99" width="212" height="176" rx="6" fill="#111111"/>
  <rect x="32" y="96" width="212" height="176" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="48" y="110" width="92" height="22" rx="4" fill="#d99b26"/>
  <text x="94" y="125" text-anchor="middle" class="badge" fill="#ffffff">HOST RAM</text>
  <text x="48" y="156" class="label">Pinned Host Memory</text>
  <text x="48" y="179" class="sub">594 MiB static table</text>
  <text x="48" y="200" class="sub">128 rows / step</text>
  <rect x="48" y="218" width="180" height="36" rx="5" fill="#ffffff" stroke="#d99b26" stroke-width="1.4"/>
  <text x="138" y="234" text-anchor="middle" class="mono">~37 MiB / step</text>
  <text x="138" y="249" text-anchor="middle" class="sub">UVA zero-copy loads</text>

  <!-- Channel A Arrow (Host -> GPU) -->
  <rect x="252" y="124" width="88" height="20" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="296" y="138" text-anchor="middle" class="badge" fill="#e62b2b">CHANNEL A</text>
  <text x="296" y="164" text-anchor="middle" class="mono">PCIe 4.0 x16</text>
  <line x1="248" y1="184" x2="342" y2="184" stroke="#e62b2b" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="296" y="206" text-anchor="middle" class="mono" fill="#e62b2b">~24 GB/s</text>
  <text x="296" y="224" text-anchor="middle" class="sub">Slow link</text>

  <!-- Center Node: GPU SM Array -->
  <rect x="351" y="99" width="244" height="176" rx="6" fill="#111111"/>
  <rect x="348" y="96" width="244" height="176" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="364" y="110" width="118" height="22" rx="4" fill="#0047ab"/>
  <text x="423" y="125" text-anchor="middle" class="badge" fill="#ffffff">128 SMs · GPU</text>
  <text x="470" y="156" text-anchor="middle" class="label">GPU Array (128 SMs)</text>
  <text x="470" y="177" text-anchor="middle" class="sub">Block scheduler owns slots</text>
  <rect x="364" y="194" width="212" height="60" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="470" y="216" text-anchor="middle" class="label">Non-Preemptive Slots</text>
  <text x="470" y="236" text-anchor="middle" class="sub">Blocks stay until exit</text>

  <!-- Channel B Arrow (VRAM -> GPU) -->
  <rect x="600" y="124" width="88" height="20" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.3"/>
  <text x="644" y="138" text-anchor="middle" class="badge" fill="#0047ab">CHANNEL B</text>
  <text x="644" y="164" text-anchor="middle" class="mono" fill="#0047ab">~1,000 GB/s</text>
  <line x1="690" y1="184" x2="598" y2="184" stroke="#0047ab" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="644" y="206" text-anchor="middle" class="sub">Local VRAM</text>
  <text x="644" y="224" text-anchor="middle" class="sub">Fast bus</text>

  <!-- Right Node: Local VRAM Weights -->
  <rect x="697" y="99" width="194" height="176" rx="6" fill="#111111"/>
  <rect x="694" y="96" width="194" height="176" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="710" y="110" width="104" height="22" rx="4" fill="#111111"/>
  <text x="762" y="125" text-anchor="middle" class="badge" fill="#ffffff">LOCAL VRAM</text>
  <text x="710" y="156" class="label">Layer Weights</text>
  <text x="710" y="179" class="sub">28-layer 7B (BF16)</text>
  <text x="710" y="200" class="sub">Streamed per layer</text>
  <rect x="710" y="218" width="162" height="36" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="791" y="234" text-anchor="middle" class="mono">~466 MB / layer</text>
  <text x="791" y="249" text-anchor="middle" class="sub">Shared by batch</text>

  <!-- Bottom Takeaway Bar -->
  <rect x="32" y="294" width="856" height="30" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.25"/>
  <text x="460" y="313" text-anchor="middle" class="sub">Rule: Speed depends on non-preemptive SM slots &amp; layer weight reads — not skipped FLOPs.</text>
</svg>
