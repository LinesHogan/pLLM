<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 404" width="100%" role="img" aria-label="Smuggling dynamic external tensor pointers into a frozen CUDA Graph via a fixed-address descriptor table">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="396" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Figure Header -->
  <text x="28" y="38" class="title">Pointer Smuggling: Passing Relocated Addresses as Plain int64 Values</text>
  <rect x="698" y="21" width="194" height="22" rx="4" fill="#111111"/>
  <text x="795" y="36" text-anchor="middle" class="badge" fill="#ffffff">FIG 03 · POINTER SMUGGLING</text>

  <!-- Top Card: Fixed-Address Routing Table -->
  <rect x="31" y="63" width="864" height="126" rx="6" fill="#111111"/>
  <rect x="28" y="60" width="864" height="126" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>

  <rect x="46" y="73" width="118" height="20" rx="4" fill="#0047ab"/>
  <text x="105" y="87" text-anchor="middle" class="badge" fill="#ffffff">FROZEN BASE</text>
  <text x="176" y="88" class="label">Fixed-address routing table (0xAAAA0000 — bound once at capture, never moves)</text>

  <!-- Descriptor Slots -->
  <rect x="46" y="104" width="388" height="66" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="62" y="126" class="mono" fill="#0047ab">descriptor[0]: 0x7f8812340000</text>
  <text x="62" y="152" class="sub">int64 ← external_tensor.data_ptr() (CPU write)</text>

  <rect x="450" y="104" width="206" height="66" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="466" y="126" class="mono">descriptor[1]: 3584</text>
  <text x="466" y="152" class="sub">int64 ← stride 0</text>

  <rect x="672" y="104" width="202" height="66" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="688" y="126" class="mono">descriptor[2]: 1</text>
  <text x="688" y="152" class="sub">int64 ← stride 1</text>

  <!-- Middle Step Boxes (Triton Kernel Register Cast) -->
  <line x1="240" y1="186" x2="240" y2="210" stroke="#0047ab" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="46" y="212" width="388" height="58" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.6"/>
  <text x="62" y="234" class="mono">1. tl.load(descriptor)</text>
  <text x="62" y="256" class="sub">Loads 64-bit integer (0x7f8812340000)</text>

  <line x1="434" y1="241" x2="472" y2="241" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <rect x="476" y="212" width="398" height="58" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.6"/>
  <text x="492" y="234" class="mono" fill="#e62b2b">2. .to(tl.pointer_type(...))</text>
  <text x="492" y="256" class="sub">Casts back to typed device pointer T* in registers</text>

  <line x1="675" y1="270" x2="675" y2="294" stroke="#e62b2b" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Bottom Card: Relocated Upstream Tensor -->
  <rect x="31" y="299" width="864" height="82" rx="6" fill="#111111"/>
  <rect x="28" y="296" width="864" height="82" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>

  <rect x="46" y="309" width="118" height="20" rx="4" fill="#059669"/>
  <text x="105" y="323" text-anchor="middle" class="badge" fill="#ffffff">DYNAMIC HBM</text>
  <text x="176" y="324" class="label">Relocated upstream tensor (allocated at 0x7f8812340000 on this step)</text>

  <!-- Tensor Memory Row Blocks -->
  <rect x="46" y="338" width="144" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="118" y="356" text-anchor="middle" class="mono">row 0</text>

  <rect x="200" y="338" width="144" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="272" y="356" text-anchor="middle" class="mono">row 1</text>

  <rect x="354" y="338" width="144" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="426" y="356" text-anchor="middle" class="mono">row 2</text>

  <text x="514" y="357" class="mono" fill="#3f3f46">...</text>

  <rect x="554" y="338" width="144" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <text x="626" y="356" text-anchor="middle" class="mono">row N-1</text>

  <text x="716" y="356" class="mono" fill="#047857">addr + idx*3584</text>
</svg>
