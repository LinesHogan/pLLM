    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="296" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="196" height="24" rx="4" fill="#d99b26"/>
  <text x="118.0" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">BUG 2 · KV PREEMPTION</text>
  <text x="228" y="33" class="title" fill="#111111">问题二：在线切层后发生 KV 抢占重算，新层参数覆盖了旧词的 KV 历史</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="110" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="42" y="86" class="sec" fill="#991b1b">改写激活的干预钩子：中途换层 + 显存满触发抢占重算 = 上下文特征错乱</text>
  <rect x="42" y="100" width="276" height="54" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="180" y="122" text-anchor="middle" class="label-sm" fill="#111111">步 1..10：在 Layer 2 干预下生成 10 个词</text>
  <text x="180" y="142" text-anchor="middle" class="mono-sm" fill="#111111">KV[1..10] reflects Layer-2 steering</text>
  <line x1="318" y1="127" x2="358" y2="127" stroke="#111111" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="362" y="100" width="286" height="54" rx="4" fill="#fef3c7" stroke="#d99b26" stroke-width="1.3"/>
  <text x="505" y="122" text-anchor="middle" class="label-sm" fill="#92400e">步 11：切到 Layer 4，恰逢 KV 满被换出</text>
  <text x="505" y="142" text-anchor="middle" class="sub-sm" fill="#92400e">KV[1..10] 物理块被回收，历史层号未存档</text>
  <line x1="648" y1="127" x2="688" y2="127" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <rect x="692" y="100" width="306" height="54" rx="4" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="845" y="122" text-anchor="middle" class="label-sm" fill="#991b1b">恢复重算：拿 Layer 4 重算了前 10 个旧词！</text>
  <text x="845" y="142" text-anchor="middle" class="sub-sm" fill="#991b1b">词序列与 KV 因果脱节 -&gt; 必须显式报错拦截</text>
  <rect x="24" y="186" width="992" height="98" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="42" y="210" class="sec" fill="#065f46">精细拆分：纯只读探针 (Read-Only Probe) 不改主干 KV，照常放行前缀缓存与无损重算</text>
  <text x="42" y="238" class="sub" fill="#065f46">· 改写类钩子 (Patch / LoRA)：标记进 kv_mutating_states，禁用前缀缓存，在线换层后禁止静默重算旧词；</text>
  <text x="42" y="264" class="sub" fill="#065f46">· 只读类探针 (Residual / Logits Tap)：主干 K/V 与原模型 100% 相同，开启前缀缓存与抢占重算完全无损。</text>
</svg>
