<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="100%" role="img" aria-label="差异一：IEEE 754 float16 在 [2048, 4096) 区间的刻度间距 (ULP = 2.0) 与大数吞小数">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="312" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="163" height="24" rx="4" fill="#d99b26"/>
  <text x="101.5" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">TRAP 1 · FP16 ULP</text>
  <text x="195" y="33" class="title" fill="#111111">差异一：IEEE 754 float16 在 [2048, 4096) 区间的刻度间距 (ULP = 2.0) 与大数吞小数</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="106" rx="6" fill="#fffbeb" stroke="#d99b26" stroke-width="1.5"/>
  <text x="42" y="84" class="sec" fill="#92400e">float16 刻度尺：在 [2048, 4096) 区间，10 位尾数均分 2048 跨度 -&gt; 最小刻度 = 2.0（根本不存在 2049！）</text>
  <line x1="80" y1="126" x2="960" y2="126" stroke="#111111" stroke-width="2"/>
  <line x1="140" y1="116" x2="140" y2="136" stroke="#111111" stroke-width="2"/>
  <text x="140" y="154" text-anchor="middle" class="mono-sm" fill="#111111">2048.0</text>
  <line x1="360" y1="116" x2="360" y2="136" stroke="#e62b2b" stroke-width="2"/>
  <text x="360" y="154" text-anchor="middle" class="mono-sm" fill="#e62b2b">2049.0 (X)</text>
  <line x1="580" y1="116" x2="580" y2="136" stroke="#111111" stroke-width="2"/>
  <text x="580" y="154" text-anchor="middle" class="mono-sm" fill="#111111">2050.0</text>
  <line x1="800" y1="116" x2="800" y2="136" stroke="#111111" stroke-width="2"/>
  <text x="800" y="154" text-anchor="middle" class="mono-sm" fill="#111111">2052.0</text>
  <path d="M 360 112 Q 250 92 146 112" fill="none" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="252" y="102" text-anchor="middle" class="sub-sm" fill="#e62b2b">偶舍入退回 2048.0</text>
  <rect x="24" y="182" width="484" height="118" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="42" y="206" class="label" fill="#991b1b">PyTorch 分步 FP16：2048 + 1 - 2048 == 0</text>
  <text x="42" y="232" class="mono-sm" fill="#111111">1) wh_b = fp16(2048.0) + fp16(1.0) -> fp16(2048.0)</text>
  <text x="42" y="254" class="mono-sm" fill="#111111">2) wh_b - fp16(2048.0)             -> fp16(0.0)</text>
  <text x="42" y="280" class="sub-sm" fill="#991b1b">中间落回 FP16 时，+1.0 直接被精度刻度吞没</text>
  <rect x="532" y="182" width="484" height="118" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="206" class="label" fill="#065f46">Triton 寄存器内对齐：零额外 HBM 读写复现分步舍入</text>
  <text x="550" y="232" class="mono-sm" fill="#065f46">wh_b = (wh + b).to(tl.float16).to(tl.float32)</text>
  <text x="550" y="254" class="mono-sm" fill="#065f46">coeff = (wh_b - hr).to(tl.float16).to(tl.float32)</text>
  <text x="550" y="280" class="sub-sm" fill="#065f46">既保住融合算子省带宽的优势，又与静态路径逐位一致</text>
</svg>
