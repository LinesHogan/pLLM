<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" role="img" aria-label="Flattening Batched Activations: 3D Single-Request Slices to 2D Packed Rows">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="332" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="160" height="22" rx="4" fill="#111111"/>
  <text x="108" y="37" text-anchor="middle" class="badge" fill="#ffffff">FIG 01 · TENSOR PACKING</text>
  <text x="200" y="39" class="title">Flattening Batched Activations: 3D Slices to 2D Packed Rows</text>
  <text x="28" y="64" class="sub">The scheduler packs variable decode &amp; chunked-prefill budgets end-to-end; static CUDA Graphs trail silent padding rows</text>

  <!-- Left Box: 3D Tensor -->
  <rect x="31" y="87" width="320" height="222" rx="6" fill="#111111"/>
  <rect x="28" y="84" width="320" height="222" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="109" class="label">Single-Request 3D</text>
  <text x="184" y="109" class="mono" fill="#0047ab">[B, S, H]</text>

  <!-- Req 0_0 -->
  <rect x="44" y="124" width="288" height="46" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="58" y="152" class="label">Req 0_0 (decode)</text>
  <rect x="246" y="135" width="72" height="24" rx="4" fill="#0047ab"/>
  <text x="282" y="151" text-anchor="middle" class="badge" fill="#ffffff">[1 tok]</text>

  <!-- Req 1 -->
  <rect x="44" y="182" width="288" height="46" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="58" y="210" class="label">Req 1 (decode)</text>
  <rect x="246" y="193" width="72" height="24" rx="4" fill="#059669"/>
  <text x="282" y="209" text-anchor="middle" class="badge" fill="#ffffff">[1 tok]</text>

  <!-- Req 2 -->
  <rect x="44" y="240" width="288" height="50" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="58" y="270" class="label">Req 2 (chunk)</text>
  <rect x="238" y="253" width="80" height="24" rx="4" fill="#d99b26"/>
  <text x="278" y="269" text-anchor="middle" class="badge" fill="#111111">[61 tok]</text>

  <!-- Center Connector Arrow -->
  <text x="385" y="178" text-anchor="middle" class="badge" fill="#0047ab">PACK</text>
  <line x1="356" y1="194" x2="412" y2="194" stroke="#0047ab" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="385" y="214" text-anchor="middle" class="sub">flatten</text>

  <!-- Right Box: 2D Flattened Tensor -->
  <rect x="425" y="87" width="470" height="222" rx="6" fill="#111111"/>
  <rect x="422" y="84" width="470" height="222" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="438" y="109" class="label">Continuous-Batching 2D Tensor</text>
  <text x="662" y="109" class="mono" fill="#0047ab">[num_tokens, H]</text>

  <!-- Row 0 -->
  <rect x="438" y="122" width="438" height="36" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="145" class="mono" fill="#0047ab">Row 0</text>
  <text x="546" y="145" class="sub">Req 0_0, token offset 5 (decode)</text>

  <!-- Row 1..2 -->
  <rect x="438" y="164" width="438" height="36" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="187" class="mono" fill="#059669">Row 1..2</text>
  <text x="546" y="187" class="sub">Other active decode tokens (Req 1_0, Req 1)</text>

  <!-- Row 3..63 -->
  <rect x="438" y="206" width="438" height="40" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="231" class="mono" fill="#111111">Row 3..63</text>
  <text x="546" y="231" class="sub">Req 2, offsets 52..112 (prefill chunk)</text>

  <!-- Row 64.. -->
  <rect x="438" y="252" width="438" height="38" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="452" y="276" class="mono" fill="#e62b2b">Row 64..</text>
  <text x="546" y="276" class="sub" style="fill: #e62b2b; font-weight: 600;">Optional trailing CUDA Graph padding</text>
</svg>
