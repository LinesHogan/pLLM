<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 312" width="100%" role="img" aria-label="Trap 2: Multi-GPU FP32 Partial Sums Meet PyTorch&#x27;s Weakly-Typed Python float">
  <defs>
