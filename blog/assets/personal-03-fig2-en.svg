  </defs>
  <rect x="4" y="4" width="1032" height="304" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="188" height="24" rx="4" fill="#0047ab"/>
  <text x="114.0" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">TRAP 2 · WEAK SCALAR</text>
  <text x="220" y="33" class="title" fill="#111111">Trap 2: Multi-GPU FP32 Partial Sums Meet PyTorch&#x27;s Weakly-Typed Python float</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="78" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="42" y="86" class="sec" fill="#1e3a8a">Context: Why is `output` float32 under Multi-GPU Tensor Parallelism (TP &gt; 1)?</text>
  <text x="42" y="110" class="sub" fill="#3f3f46">Single-GPU output is BF16 (hiding extra rounding); TP&gt;1 RowParallelLinear keeps `output` in FP32 until cross-GPU All-Reduce finishes.</text>
  <rect x="24" y="156" width="484" height="134" rx="6" fill="#fffbeb" stroke="#d99b26" stroke-width="1.4"/>
  <text x="42" y="180" class="label" fill="#92400e">PyTorch Reference: (bf16_res * 0.123).to(fp32)</text>
  <text x="42" y="206" class="sub-sm" fill="#92400e">Python `float` is weakly typed: `bf16 * float` stays bfloat16!</text>
  <text x="42" y="232" class="mono-sm" fill="#111111">bf16(27.0) * 0.123 -> bf16(3.328125)</text>
  <text x="42" y="254" class="mono-sm" fill="#111111">                   -> fp32(3.3281250)</text>
  <rect x="532" y="156" width="484" height="134" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="180" class="label" fill="#065f46">Initial Triton vs. Fixed In-Register Cast</text>
  <text x="550" y="206" class="mono-sm" fill="#e62b2b">Bug: fp32(27.0) * 0.123 -> 3.3210001 (mismatch!)</text>
  <text x="550" y="234" class="mono-sm" fill="#065f46">Fix: (corr.to(fp32) * scale).to(bf16).to(out_ty)</text>
  <text x="550" y="262" class="sub-sm" fill="#065f46">Both TP=1 (BF16) and TP&gt;1 (FP32) now yield 3.328125</text>
</svg>
