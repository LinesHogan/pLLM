<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 432" width="100%" role="img" aria-label="即时执行与静态 CUDA Graph 回放对比时序图">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.04em; }
  </style>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="424" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Figure Header -->
  <text x="28" y="38" class="title">即时执行发射瓶颈 vs. 静态 CUDA Graph 回放</text>
  <rect x="748" y="21" width="144" height="22" rx="4" fill="#111111"/>
  <text x="820" y="36" text-anchor="middle" class="badge" fill="#ffffff">FIG 01 · TIMELINE</text>

  <!-- Panel 1: Eager Execution -->
  <rect x="31" y="61" width="864" height="154" rx="6" fill="#111111"/>
  <rect x="28" y="58" width="864" height="154" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>

  <rect x="46" y="71" width="68" height="22" rx="4" fill="#e62b2b"/>
  <text x="80" y="86" text-anchor="middle" class="badge" fill="#ffffff">EAGER</text>
  <text x="126" y="87" class="label">即时执行：CPU 逐个发射算子 — 发射间隙把 GPU 算力切碎</text>

  <!-- CPU row -->
  <text x="46" y="124" class="mono" fill="#3f3f46">CPU</text>
  <rect x="104" y="106" width="128" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="168" y="124" text-anchor="middle" class="mono">发 k1</text>

  <rect x="244" y="106" width="128" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="308" y="124" text-anchor="middle" class="mono">发 k2</text>

  <rect x="384" y="106" width="128" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="448" y="124" text-anchor="middle" class="mono">发 k3</text>

  <rect x="524" y="106" width="128" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="588" y="124" text-anchor="middle" class="mono">发 k4</text>

  <text x="668" y="125" class="mono" fill="#3f3f46">...</text>

  <!-- Dispatch arrows -->
  <line x1="232" y1="134" x2="246" y2="152" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="372" y1="134" x2="386" y2="152" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="512" y1="134" x2="526" y2="152" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="652" y1="134" x2="666" y2="152" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- GPU row -->
  <text x="46" y="172" class="mono" fill="#3f3f46">GPU</text>
  <rect x="248" y="154" width="46" height="28" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="271" y="172" text-anchor="middle" class="mono" fill="#0047ab">k1</text>

  <rect x="298" y="154" width="86" height="28" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="341" y="172" text-anchor="middle" class="sub" fill="#e62b2b">空转</text>

  <rect x="388" y="154" width="46" height="28" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="411" y="172" text-anchor="middle" class="mono" fill="#0047ab">k2</text>

  <rect x="438" y="154" width="86" height="28" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="481" y="172" text-anchor="middle" class="sub" fill="#e62b2b">空转</text>

  <rect x="528" y="154" width="46" height="28" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="551" y="172" text-anchor="middle" class="mono" fill="#0047ab">k3</text>

  <rect x="578" y="154" width="86" height="28" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="621" y="172" text-anchor="middle" class="sub" fill="#e62b2b">空转</text>

  <rect x="668" y="154" width="46" height="28" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="691" y="172" text-anchor="middle" class="mono" fill="#0047ab">k4</text>

  <text x="728" y="172" class="mono" fill="#3f3f46">...</text>

  <text x="104" y="201" class="sub" fill="#b91c1c">代价：0.5B 模型关掉静态图后，CPU 发射间隙直接让吞吐掉一半</text>

  <!-- Panel 2: Static CUDA Graph Replay -->
  <rect x="31" y="233" width="864" height="172" rx="6" fill="#111111"/>
  <rect x="28" y="230" width="864" height="172" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>

  <rect x="46" y="243" width="108" height="22" rx="4" fill="#059669"/>
  <text x="100" y="258" text-anchor="middle" class="badge" fill="#ffffff">CUDA GRAPH</text>
  <text x="166" y="259" class="label">静态图回放：预热期录成驱动指令序列，运行期单次提交</text>

  <!-- Warmup Sub-panel -->
  <rect x="46" y="274" width="828" height="40" rx="5" fill="#fefce8" stroke="#111111" stroke-width="1.4"/>
  <text x="62" y="298" class="mono" fill="#b45309">预热期 (1次)</text>
  <rect x="172" y="280" width="136" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="240" y="298" text-anchor="middle" class="sub">走一遍算子流</text>
  <line x1="312" y1="294" x2="344" y2="294" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="350" y="280" width="510" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="605" y="298" text-anchor="middle" class="sub">驱动锁死网格尺寸与所有张量的裸显存地址 (data_ptr)</text>

  <!-- Runtime Sub-rows -->
  <text x="46" y="343" class="mono" fill="#3f3f46">CPU</text>
  <text x="46" y="378" class="mono" fill="#3f3f46">GPU</text>
  <text x="104" y="343" class="sub" fill="#047857">运行期 (每步)</text>

  <rect x="190" y="324" width="160" height="28" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="270" y="342" text-anchor="middle" class="mono">cudaGraphLaunch()</text>

  <path d="M 350 338 L 372 338 L 372 356" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Packed GPU kernels -->
  <rect x="372" y="359" width="40" height="28" rx="3" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="392" y="377" text-anchor="middle" class="mono" fill="#0047ab">k1</text>
  <rect x="412" y="359" width="40" height="28" rx="3" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="432" y="377" text-anchor="middle" class="mono" fill="#0047ab">k2</text>
  <rect x="452" y="359" width="40" height="28" rx="3" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="472" y="377" text-anchor="middle" class="mono" fill="#0047ab">k3</text>
  <rect x="492" y="359" width="40" height="28" rx="3" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="512" y="377" text-anchor="middle" class="mono" fill="#0047ab">k4</text>
  <rect x="532" y="359" width="40" height="28" rx="3" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="552" y="377" text-anchor="middle" class="mono" fill="#0047ab">k5</text>
  <text x="582" y="378" class="mono" fill="#3f3f46">...</text>

  <text x="614" y="377" class="sub" fill="#047857">硬件队列连续执行，Python 不再介入</text>
</svg>
