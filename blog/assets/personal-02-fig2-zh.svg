<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 324" width="100%" role="img" aria-label="方案二 vs 方案三：全算后掩码 (torch.where) 与片上 L2 标量早退 + 原地累加">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="316" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="130" height="24" rx="4" fill="#059669"/>
  <text x="85.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">KERNEL DESIGN</text>
  <text x="162" y="33" class="title" fill="#111111">方案二 vs 方案三：全算后掩码 (torch.where) 与片上 L2 标量早退 + 原地累加</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="112" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <rect x="38" y="74" width="276" height="22" rx="4" fill="#e62b2b"/>
  <text x="176" y="89" text-anchor="middle" class="label-sm" fill="#ffffff">方案二：全算后 torch.where 掩码</text>
  <rect x="38" y="106" width="270" height="52" rx="5" fill="#ffffff" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="173" y="128" text-anchor="middle" class="label-sm" fill="#991b1b">27 个未命中层照常读 HBM 权重与隐藏态</text>
  <text x="173" y="146" text-anchor="middle" class="mono-sm" fill="#991b1b">delta = h @ A @ B</text>
  <line x1="308" y1="132" x2="348" y2="132" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <rect x="352" y="106" width="320" height="52" rx="5" fill="#ffffff" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="512" y="128" text-anchor="middle" class="mono-sm" fill="#991b1b">out = torch.where(mask, h + delta, h)</text>
  <text x="512" y="146" text-anchor="middle" class="sub-sm" fill="#991b1b">算完再丢弃，连原样返回 out 都得全宽读写一遍 HBM</text>
  <rect x="700" y="106" width="298" height="52" rx="5" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="849" y="136" text-anchor="middle" class="label-sm" fill="#991b1b">解码卡在显存带宽，27 层白烧 HBM 流量</text>
  <rect x="24" y="188" width="992" height="116" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="38" y="200" width="332" height="22" rx="4" fill="#059669"/>
  <text x="204" y="215" text-anchor="middle" class="label-sm" fill="#ffffff">方案三：L2 标量早退 Triton 内核 + 原地累加</text>
  <rect x="38" y="232" width="270" height="56" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="173" y="254" text-anchor="middle" class="label-sm" fill="#065f46">1. 线程块首条指令读片上 L2 路由表</text>
  <text x="173" y="274" text-anchor="middle" class="mono-sm" fill="#065f46">if tl.load(owner + row) &lt; 0: return</text>
  <line x1="308" y1="260" x2="348" y2="260" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="352" y="232" width="320" height="56" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="512" y="254" text-anchor="middle" class="label-sm" fill="#065f46">2. 复用已有输出端口原地累加 (add_into)</text>
  <text x="512" y="274" text-anchor="middle" class="sub-sm" fill="#065f46">未命中行直接退出，无需搬运原隐藏态 h</text>
  <rect x="700" y="232" width="298" height="56" rx="5" fill="#bbf7d0" stroke="#059669" stroke-width="1.5"/>
  <text x="849" y="255" text-anchor="middle" class="label-sm" fill="#065f46">未命中层：0 字节权重/激活 HBM 读写</text>
  <text x="849" y="275" text-anchor="middle" class="label-sm" fill="#065f46">28 层全挂仅增 ~0.8 ms (RTX 4090)</text>
</svg>
