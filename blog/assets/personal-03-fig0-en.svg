<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 312" width="100%" role="img" aria-label="Big Picture: Eager Reference vs. Fused Triton Path &amp; Greedy Decode Snowballing">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="304" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="114" height="24" rx="4" fill="#0047ab"/>
  <text x="77.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">BIG PICTURE</text>
  <text x="146" y="33" class="title" fill="#111111">Big Picture: Eager Reference vs. Fused Triton Path &amp; Greedy Decode Snowballing</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="64" width="490" height="226" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <text x="42" y="88" class="sec" fill="#111111">Two Execution Paths for the Exact Same Formula</text>
  <rect x="42" y="104" width="454" height="76" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.3"/>
  <text x="58" y="126" class="label-sm" fill="#1e3a8a">Path A: Eager PyTorch Reference (Chained ATen Ops)</text>
  <text x="58" y="148" class="mono-sm" fill="#111111">out = (h @ W.T + b - h @ R) @ R.T</text>
  <text x="58" y="168" class="sub-sm" fill="#52525b">Every intermediate op writes back to FP16/BF16 (rounds at each step)</text>
  <rect x="42" y="194" width="454" height="78" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="58" y="216" class="label-sm" fill="#065f46">Path B: Fused Triton Kernel (Online Fast Path)</text>
  <text x="58" y="238" class="mono-sm" fill="#111111">acc = tl.dot(...) + b - tl.dot(...)  # in tl.float32</text>
  <text x="58" y="258" class="sub-sm" fill="#065f46">Intermediates stay in FP32 registers; casts only once on store</text>
  <line x1="514" y1="176" x2="552" y2="176" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <rect x="556" y="64" width="460" height="226" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="574" y="88" class="sec" fill="#991b1b">Why Care About 1 ULP? Greedy Autoregressive Divergence</text>
  <rect x="574" y="106" width="424" height="52" rx="5" fill="#ffffff" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="590" y="128" class="label-sm" fill="#111111">Step t: Two top candidate tokens sit within 1 ULP</text>
  <text x="590" y="146" class="mono-sm" fill="#111111">Path A -> "However"    vs    Path B -> "Therefore"</text>
  <line x1="786" y1="158" x2="786" y2="180" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <rect x="574" y="184" width="424" height="88" rx="5" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.4"/>
  <text x="590" y="208" class="label-sm" fill="#991b1b">Steps t+1..T: Chosen token feeds back into next step</text>
  <text x="590" y="230" class="sub-sm" fill="#991b1b">A 1-ULP rounding discrepancy snowballs into two completely</text>
  <text x="590" y="250" class="sub-sm" fill="#991b1b">different paragraphs—making users suspect broken weights!</text>
</svg>
