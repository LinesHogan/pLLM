<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" role="img" aria-label="CSR Binary Search Inversion Under Static Graph Padding (Step 5)">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="412" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="144" height="22" rx="4" fill="#111111"/>
  <text x="100" y="37" text-anchor="middle" class="badge" fill="#ffffff">FIG 03 · CSR SEARCH</text>
  <text x="184" y="39" class="title">Step 5 CSR Binary Search &amp; Clamp Under Static Graph Padding</text>
  <text x="28" y="64" class="sub">Run torch.searchsorted(query_start_loc[1:], rows, right=True) and clamp trailing zero-length padding to slot 3</text>

  <!-- Top Array Boxes -->
  <rect x="31" y="85" width="432" height="68" rx="6" fill="#111111"/>
  <rect x="28" y="82" width="432" height="68" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="109" class="mono">query_start_loc = [0, 1, 2, 3, <tspan fill="#e62b2b">3</tspan>]</text>
  <text x="44" y="135" class="mono">seq_lens        = [9, 9, 6, <tspan fill="#e62b2b">0</tspan>]</text>

  <rect x="481" y="85" width="414" height="68" rx="6" fill="#111111"/>
  <rect x="478" y="82" width="414" height="68" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="494" y="108" class="label">Sliced Right Endpoints</text>
  <text x="494" y="135" class="mono" fill="#0047ab">query_start_loc[1:] = [1, 2, 3, <tspan fill="#e62b2b">3</tspan>]</text>

  <!-- Column Subheaders -->
  <text x="76" y="169" text-anchor="middle" class="badge" fill="#3f3f46">INPUT ROW</text>
  <text x="255" y="169" text-anchor="middle" class="badge" fill="#3f3f46">BINARY SEARCH CHECK</text>
  <text x="452" y="169" text-anchor="middle" class="badge" fill="#3f3f46">SEARCHSORTED</text>
  <text x="624" y="169" text-anchor="middle" class="badge" fill="#3f3f46">CLAMP(MAX=3)</text>
  <text x="811" y="169" text-anchor="middle" class="badge" fill="#3f3f46">TARGET SLOT</text>

  <!-- Row 0 -->
  <rect x="28" y="178" width="96" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="76" y="200" text-anchor="middle" class="mono">row = 0</text>
  <line x1="124" y1="195" x2="148" y2="195" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="152" y="178" width="206" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="255" y="200" text-anchor="middle" class="mono">0 &lt; 1 (hits idx 0)</text>
  <line x1="358" y1="195" x2="382" y2="195" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="386" y="178" width="132" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="200" text-anchor="middle" class="mono">returns 0</text>
  <line x1="518" y1="195" x2="542" y2="195" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="546" y="178" width="156" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="624" y="200" text-anchor="middle" class="mono">0 &lt;= 3 → 0</text>
  <line x1="702" y1="195" x2="726" y2="195" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="730" y="178" width="162" height="34" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="811" y="200" text-anchor="middle" class="label">Req 0_0 (slot 0)</text>

  <!-- Row 1 -->
  <rect x="28" y="220" width="96" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="76" y="242" text-anchor="middle" class="mono">row = 1</text>
  <line x1="124" y1="237" x2="148" y2="237" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="152" y="220" width="206" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="255" y="242" text-anchor="middle" class="mono">1 &lt; 2 (hits idx 1)</text>
  <line x1="358" y1="237" x2="382" y2="237" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="386" y="220" width="132" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="242" text-anchor="middle" class="mono">returns 1</text>
  <line x1="518" y1="237" x2="542" y2="237" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="546" y="220" width="156" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="624" y="242" text-anchor="middle" class="mono">1 &lt;= 3 → 1</text>
  <line x1="702" y1="237" x2="726" y2="237" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="730" y="220" width="162" height="34" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="811" y="242" text-anchor="middle" class="label">Req 1_0 (slot 1)</text>

  <!-- Row 2 -->
  <rect x="28" y="262" width="96" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="76" y="284" text-anchor="middle" class="mono">row = 2</text>
  <line x1="124" y1="279" x2="148" y2="279" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="152" y="262" width="206" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="255" y="284" text-anchor="middle" class="mono">2 &lt; 3 (hits idx 2)</text>
  <line x1="358" y1="279" x2="382" y2="279" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="386" y="262" width="132" height="34" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="452" y="284" text-anchor="middle" class="mono">returns 2</text>
  <line x1="518" y1="279" x2="542" y2="279" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="546" y="262" width="156" height="34" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <text x="624" y="284" text-anchor="middle" class="mono">2 &lt;= 3 → 2</text>
  <line x1="702" y1="279" x2="726" y2="279" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="730" y="262" width="162" height="34" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <text x="811" y="284" text-anchor="middle" class="label">Req 1 (slot 2)</text>

  <!-- Row 3 (Padding Clamp Case) -->
  <rect x="28" y="304" width="96" height="36" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="76" y="327" text-anchor="middle" class="mono" fill="#e62b2b">row = 3</text>
  <line x1="124" y1="322" x2="148" y2="322" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="152" y="304" width="206" height="36" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="255" y="327" text-anchor="middle" class="mono" fill="#e62b2b">3 &gt;= 3 (past end)</text>
  <line x1="358" y1="322" x2="382" y2="322" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="386" y="304" width="132" height="36" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75"/>
  <text x="452" y="327" text-anchor="middle" class="mono" fill="#e62b2b">returns 4 (!)</text>
  <line x1="518" y1="322" x2="542" y2="322" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="546" y="304" width="156" height="36" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="624" y="327" text-anchor="middle" class="mono" fill="#111111">clamp(max=3)→3</text>
  <line x1="702" y1="322" x2="726" y2="322" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <rect x="730" y="304" width="162" height="36" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="811" y="327" text-anchor="middle" class="label" style="fill: #e62b2b;">Padding (slot 3)</text>

  <!-- Bottom Formula Bar -->
  <rect x="28" y="358" width="864" height="38" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="382" class="mono">positions = seq_lens[requests] - query_start_loc[requests + 1] + rows</text>
  <rect x="690" y="366" width="186" height="22" rx="4" fill="#111111"/>
  <text x="783" y="381" text-anchor="middle" class="badge" fill="#ffffff">O(log B) · ZERO SYNC</text>
</svg>
