<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 332" width="100%" role="img" aria-label="动态切层（LayerRoute）四类底层排障落点">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
