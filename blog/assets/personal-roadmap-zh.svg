<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 344" width="100%" role="img" aria-label="四篇一线排障笔记在推理引擎中的层次落点">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="336" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="96" height="24" rx="4" fill="#111111"/>
  <text x="68.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">OVERVIEW</text>
  <text x="128" y="33" class="title" fill="#111111">四篇一线排障笔记在推理引擎中的层次落点</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="66" width="300" height="50" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <rect x="36" y="79" width="74" height="24" rx="4" fill="#0047ab"/>
  <text x="73" y="95" text-anchor="middle" class="badge" fill="#ffffff">LAYER 1</text>
  <text x="122" y="96" class="label" fill="#111111">图编译器栈 (torch.compile)</text>
  <line x1="324" y1="91" x2="354" y2="91" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="358" y="66" width="658" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="79" width="44" height="24" rx="4" fill="#111111"/>
  <text x="392" y="95" text-anchor="middle" class="badge" fill="#ffffff">[01]</text>
  <text x="426" y="96" class="sub" fill="#3f3f46">为什么 Eager 下写进显存池的 [7,7,7,7]，开编译后不报错却变回全零？</text>
  <line x1="174" y1="116" x2="174" y2="132" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="24" y="132" width="300" height="50" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <rect x="36" y="145" width="74" height="24" rx="4" fill="#059669"/>
  <text x="73" y="161" text-anchor="middle" class="badge" fill="#ffffff">LAYER 2</text>
  <text x="122" y="162" class="label" fill="#111111">CUDA Graph 与 GPU 内核</text>
  <line x1="324" y1="157" x2="354" y2="157" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="358" y="132" width="658" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="145" width="44" height="24" rx="4" fill="#111111"/>
  <text x="392" y="161" text-anchor="middle" class="badge" fill="#ffffff">[02]</text>
  <text x="426" y="162" class="sub" fill="#3f3f46">不花十秒重录静态图如何实时切换干预层？以及回退分支如何打碎图捕获</text>
  <line x1="174" y1="182" x2="174" y2="198" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="24" y="198" width="300" height="50" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <rect x="36" y="211" width="74" height="24" rx="4" fill="#d99b26"/>
  <text x="73" y="227" text-anchor="middle" class="badge" fill="#ffffff">LAYER 3</text>
  <text x="122" y="228" class="label" fill="#111111">浮点算术与多卡并行</text>
  <line x1="324" y1="223" x2="354" y2="223" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="358" y="198" width="658" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="211" width="44" height="24" rx="4" fill="#111111"/>
  <text x="392" y="227" text-anchor="middle" class="badge" fill="#ffffff">[03]</text>
  <text x="426" y="228" class="sub" fill="#3f3f46">为什么公式相同的融合 Triton 内核，在 [2048,0] 与多卡缩放上和 PyTorch 算得不一样？</text>
  <line x1="174" y1="248" x2="174" y2="264" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <rect x="24" y="264" width="300" height="50" rx="6" fill="#f8fafc" stroke="#111111" stroke-width="1.4"/>
  <rect x="36" y="277" width="74" height="24" rx="4" fill="#e62b2b"/>
  <text x="73" y="293" text-anchor="middle" class="badge" fill="#ffffff">LAYER 4</text>
  <text x="122" y="294" class="label" fill="#111111">连续批处理与状态调度</text>
  <line x1="324" y1="289" x2="354" y2="289" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="358" y="264" width="658" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="370" y="277" width="44" height="24" rx="4" fill="#111111"/>
  <text x="392" y="293" text-anchor="middle" class="badge" fill="#ffffff">[04]</text>
  <text x="426" y="294" class="sub" fill="#3f3f46">单步测试全绿，放进多请求并发调度后暴露的四个跨步/跨维度生命周期陷阱</text>
</svg>
