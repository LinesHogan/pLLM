  <rect x="28" y="198" width="266" height="46" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="211" width="68" height="20" rx="4" fill="#d99b26"/>
  <text x="74" y="225" text-anchor="middle" class="badge" fill="#111111">STAGE 3</text>
  <text x="118" y="226" class="label">融合算子数值一致性</text>
  <line x1="294" y1="221" x2="320" y2="221" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="324" y="198" width="608" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <rect x="336" y="211" width="42" height="20" rx="4" fill="#111111"/>
  <text x="357" y="225" text-anchor="middle" class="badge" fill="#ffffff">[03]</text>
