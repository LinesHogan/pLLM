  <line x1="294" y1="97" x2="320" y2="97" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="324" y="74" width="608" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
  <rect x="336" y="87" width="42" height="20" rx="4" fill="#111111"/>
