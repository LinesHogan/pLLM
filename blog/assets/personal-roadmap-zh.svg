  <line x1="161" y1="244" x2="161" y2="260" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="28" y="260" width="266" height="46" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="40" y="273" width="68" height="20" rx="4" fill="#e62b2b"/>
  <text x="74" y="287" text-anchor="middle" class="badge" fill="#ffffff">STAGE 4</text>
  <text x="118" y="288" class="label">torch.compile 函数化</text>
  <line x1="294" y1="283" x2="320" y2="283" stroke="#111111" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="324" y="260" width="608" height="46" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
