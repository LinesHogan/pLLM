<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 312" width="100%" role="img" aria-label="差异二：多卡 TP &gt; 1 的 FP32 部分和缓冲，撞上 Python float 标量的“弱类型”规则">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="304" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="188" height="24" rx="4" fill="#0047ab"/>
  <text x="114.0" y="32" text-anchor="middle" class="label-sm" fill="#ffffff">TRAP 2 · WEAK SCALAR</text>
  <text x="220" y="33" class="title" fill="#111111">差异二：多卡 TP &gt; 1 的 FP32 部分和缓冲，撞上 Python float 标量的“弱类型”规则</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="78" rx="6" fill="#eef4ff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="42" y="86" class="sec" fill="#1e3a8a">背景：为什么多卡张量并行 (TP &gt; 1) 下线性层输出缓冲变成了 float32？</text>
  <text x="42" y="110" class="sub" fill="#3f3f46">单卡 (TP=1) 输出直接是 BF16，掩盖了中间差异；多卡 RowParallelLinear 为避免跨卡 All-Reduce 前重复半精度舍入，先在 FP32 缓冲上累加 LoRA。</text>
  <rect x="24" y="156" width="484" height="134" rx="6" fill="#fffbeb" stroke="#d99b26" stroke-width="1.4"/>
  <text x="42" y="180" class="label" fill="#92400e">PyTorch 参考代码：(bf16_res * 0.123).to(fp32)</text>
  <text x="42" y="206" class="sub-sm" fill="#92400e">Python 原生 float 属于“弱类型”，乘 BF16 张量不会升格为 FP32！</text>
  <text x="42" y="232" class="mono-sm" fill="#111111">bf16(27.0) * 0.123 -> bf16(3.328125)</text>
  <text x="42" y="254" class="mono-sm" fill="#111111">                   -> fp32(3.3281250)</text>
  <rect x="532" y="156" width="484" height="134" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="180" class="label" fill="#065f46">初版 Triton vs 修复后寄存器截断对齐</text>
  <text x="550" y="206" class="mono-sm" fill="#e62b2b">Bug: fp32(27.0) * 0.123 -> 3.3210001 (mismatch!)</text>
  <text x="550" y="234" class="mono-sm" fill="#065f46">Fix: (corr.to(fp32) * scale).to(bf16).to(out_ty)</text>
  <text x="550" y="262" class="sub-sm" fill="#065f46">单卡 (BF16) 与多卡 (FP32) 输出从此严格一致：3.328125</text>
</svg>
