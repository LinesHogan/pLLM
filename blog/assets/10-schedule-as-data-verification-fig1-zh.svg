<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="100%" role="img" aria-label="Schedule-as-Data：三行静态元组剧本（分块预填充、解码混批与显存抢占重算）">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="468" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="22" width="142" height="22" rx="4" fill="#111111"/>
  <text x="99" y="37" text-anchor="middle" class="badge" fill="#ffffff">SCHEDULE-AS-DATA</text>
  <text x="182" y="38" class="sub">无需模拟调度器 · 仅用静态整数三元组 (req_id, scheduled, computed) 驱动微型 CPU 引擎</text>
  <text x="28" y="68" class="title">三行静态元组剧本：分块预填充 + 解码混批 + 显存抢占重算</text>

  <!-- STEP 1 -->
  <rect x="31" y="95" width="864" height="96" rx="6" fill="#111111"/>
  <rect x="28" y="92" width="864" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="44" y="106" width="68" height="24" rx="4" fill="#111111"/>
  <text x="78" y="122" text-anchor="middle" class="badge" fill="#ffffff">STEP 1</text>
  <text x="126" y="123" class="mono">[("req_b", scheduled=3, computed=0), ("req_a", scheduled=2, computed=0)]</text>

  <!-- Step 1 Token Strip -->
  <rect x="44" y="142" width="44" height="30" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="66" y="161" text-anchor="middle" class="mono">b0</text>
  <rect x="94" y="142" width="44" height="30" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="116" y="161" text-anchor="middle" class="mono">b1</text>
  <rect x="144" y="142" width="44" height="30" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="166" y="161" text-anchor="middle" class="mono">b2</text>
  <text x="200" y="162" text-anchor="middle" class="label">+</text>
  <rect x="212" y="142" width="44" height="30" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.5"/>
  <text x="234" y="161" text-anchor="middle" class="mono">a0</text>
  <rect x="262" y="142" width="44" height="30" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.5"/>
  <text x="284" y="161" text-anchor="middle" class="mono">a1</text>

  <text x="348" y="161" class="label">两请求分块预填充混排</text>
  <text x="518" y="161" class="sub">（拍平张量总行数 = 5 行，首尾拼接）</text>

  <!-- Transition 1 -> 2 -->
  <line x1="170" y1="191" x2="170" y2="215" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>
  <text x="184" y="208" class="sub">下一调度步：req_b 预填充结束，req_a 继续剩余分块</text>

  <!-- STEP 2 -->
  <rect x="31" y="223" width="864" height="96" rx="6" fill="#111111"/>
  <rect x="28" y="220" width="864" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <rect x="44" y="234" width="68" height="24" rx="4" fill="#0047ab"/>
  <text x="78" y="250" text-anchor="middle" class="badge" fill="#ffffff">STEP 2</text>
  <text x="126" y="251" class="mono">[("req_b", scheduled=1, computed=3), ("req_a", scheduled=3, computed=2)]</text>

  <!-- Step 2 Token Strip -->
  <rect x="44" y="270" width="70" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="79" y="289" text-anchor="middle" class="mono">b3 · dec</text>
  <text x="126" y="290" text-anchor="middle" class="label">+</text>
  <rect x="138" y="270" width="44" height="30" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.5"/>
  <text x="160" y="289" text-anchor="middle" class="mono">a2</text>
  <rect x="188" y="270" width="44" height="30" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.5"/>
  <text x="210" y="289" text-anchor="middle" class="mono">a3</text>
  <rect x="238" y="270" width="44" height="30" rx="4" fill="#fefce8" stroke="#d99b26" stroke-width="1.5"/>
  <text x="260" y="289" text-anchor="middle" class="mono">a4</text>

  <text x="348" y="289" class="label">req_b 转解码，req_a 算完提示词</text>
  <text x="582" y="289" class="sub">（解码 1 行 + 预填充尾块 3 行 = 4 行）</text>

  <!-- Transition 2 -> 3 -->
  <line x1="170" y1="319" x2="170" y2="343" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="184" y="322" width="96" height="20" rx="4" fill="#e62b2b"/>
  <text x="232" y="336" text-anchor="middle" class="badge" fill="#ffffff">KV 显存抢占</text>
  <text x="290" y="336" class="sub">模拟 req_a 被驱逐释放 KV 块，下一拍从 computed=0 重新入队</text>

  <!-- STEP 3 -->
  <rect x="31" y="351" width="864" height="96" rx="6" fill="#111111"/>
  <rect x="28" y="348" width="864" height="96" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <rect x="44" y="362" width="68" height="24" rx="4" fill="#e62b2b"/>
  <text x="78" y="378" text-anchor="middle" class="badge" fill="#ffffff">STEP 3</text>
  <text x="126" y="379" class="mono">[("req_a", scheduled=5, computed=0)]</text>

  <!-- Step 3 Token Strip -->
  <rect x="44" y="398" width="44" height="30" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="66" y="417" text-anchor="middle" class="mono">a0</text>
  <rect x="94" y="398" width="44" height="30" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="116" y="417" text-anchor="middle" class="mono">a1</text>
  <rect x="144" y="398" width="44" height="30" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="166" y="417" text-anchor="middle" class="mono">a2</text>
  <rect x="194" y="398" width="44" height="30" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="216" y="417" text-anchor="middle" class="mono">a3</text>
  <rect x="244" y="398" width="44" height="30" rx="4" fill="#ffffff" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="266" y="417" text-anchor="middle" class="mono">a4</text>

  <text x="348" y="417" class="label" fill="#e62b2b">req_a 被踢出后从 0 重算！</text>
  <text x="536" y="417" class="sub">（检验 keep 重复训练与 reset 状态回滚漏洞）</text>
</svg>
