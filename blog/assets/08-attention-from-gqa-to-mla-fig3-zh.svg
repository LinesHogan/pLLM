<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" role="img" aria-label="物理分页缓存布局对比：标准 GQA 与 DeepSeek MLA">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="382" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <text x="28" y="34" class="title">物理分页缓存布局对比：标准 GQA vs DeepSeek MLA</text>
  <text x="28" y="54" class="sub">为什么自定义注意力无法直接从 DeepSeek V2/V3 物理显存中读出现成的 Key 与 Value 张量</text>

  <!-- Row 1: Standard GQA -->
  <rect x="28" y="72" width="864" height="124" rx="8" fill="#f5f5f4" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="84" width="136" height="22" rx="4" fill="#0047ab"/>
  <text x="112" y="99" text-anchor="middle" class="badge" fill="#ffffff">GQA · Qwen / Llama</text>
  <text x="192" y="100" class="label">标准 GQA 缓存页：每个位置按 KV 头分别存放 K 与 V 张量</text>

  <rect x="47" y="121" width="248" height="60" rx="6" fill="#111111"/>
  <rect x="44" y="118" width="248" height="60" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="168" y="138" text-anchor="middle" class="mono">KV Head 0</text>
  <rect x="56" y="146" width="106" height="24" rx="4" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="109" y="162" text-anchor="middle" class="mono">K0 [dim]</text>
  <rect x="174" y="146" width="106" height="24" rx="4" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="227" y="162" text-anchor="middle" class="mono">V0 [dim]</text>

  <rect x="313" y="121" width="248" height="60" rx="6" fill="#111111"/>
  <rect x="310" y="118" width="248" height="60" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="434" y="138" text-anchor="middle" class="mono">KV Head 1</text>
  <rect x="322" y="146" width="106" height="24" rx="4" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="375" y="162" text-anchor="middle" class="mono">K1 [dim]</text>
  <rect x="440" y="146" width="106" height="24" rx="4" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="493" y="162" text-anchor="middle" class="mono">V1 [dim]</text>

  <text x="582" y="153" text-anchor="middle" class="mono">...</text>

  <rect x="610" y="121" width="266" height="54" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.75"/>
  <text x="743" y="144" text-anchor="middle" class="label" fill="#059669">物理显存存在明确的 K、V</text>
  <text x="743" y="164" text-anchor="middle" class="sub">可直接按头或按页切片读取</text>

  <!-- Row 2: DeepSeek MLA -->
  <rect x="28" y="212" width="864" height="154" rx="8" fill="#fefce8" stroke="#111111" stroke-width="1.5"/>
  <rect x="44" y="224" width="150" height="22" rx="4" fill="#d99b26"/>
  <text x="119" y="239" text-anchor="middle" class="badge" fill="#ffffff">MLA · DeepSeek V2/V3</text>
  <text x="206" y="240" class="label">DeepSeek MLA 压缩潜空间缓存页：所有 H 个头只共享一条低秩向量</text>

  <rect x="47" y="269" width="440" height="64" rx="6" fill="#111111"/>
  <rect x="44" y="266" width="440" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <rect x="52" y="274" width="276" height="48" rx="4" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="190" y="295" text-anchor="middle" class="label">共享压缩潜变量 c_KV</text>
  <text x="190" y="313" text-anchor="middle" class="sub">如 512 维 · 全头共享</text>

  <rect x="336" y="274" width="140" height="48" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.5"/>
  <text x="406" y="295" text-anchor="middle" class="mono">k_rope</text>
  <text x="406" y="313" text-anchor="middle" class="sub">共享 64 维</text>

  <line x1="484" y1="298" x2="532" y2="298" stroke="#111111" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-ink)"/>

  <rect x="540" y="254" width="336" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="558" y="276" class="label" fill="#e62b2b">逻辑还原公式（仅逻辑存在，共 H 个头）：</text>
  <text x="558" y="298" class="mono">K_h^nope = c_KV @ W_UK[h]</text>
  <text x="558" y="317" class="mono">V_h      = c_KV @ W_UV[h]</text>
  <text x="558" y="338" class="sub">强行物化会导致 O(L · H) 带宽爆炸</text>
</svg>
