<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" role="img" aria-label="Comparison between PagedAttention token blocks and PTTS unified tensor state layer">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, sans-serif; fill: #111111; }
    .hdr { font: 600 13.5px "DM Sans", -apple-system, sans-serif; fill: #ffffff; }
    .label { font: 600 13px "DM Sans", -apple-system, sans-serif; fill: #111111; }
    .sub { font: 400 12px "DM Sans", -apple-system, sans-serif; fill: #3f3f46; }
    .mono { font: 600 12px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: 0.03em; }
  </style>

  <rect x="4" y="4" width="912" height="422" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <text x="28" y="34" class="title">FIG 01 · Division of Labor: PagedAttention Blocks vs. PTTS Tensor State Layer</text>
  <text x="28" y="54" class="sub">PagedAttention manages append-only KV along positions; PTTS unifies non-KV states via field slots and version roots</text>

  <!-- Left Card: PagedAttention -->
  <rect x="31" y="79" width="356" height="324" rx="6" fill="#111111"/>
  <rect x="28" y="76" width="356" height="324" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="28" y="76" width="356" height="38" rx="6" fill="#111111"/>
  <rect x="28" y="102" width="356" height="12" fill="#111111"/>
  <text x="206" y="100" text-anchor="middle" class="hdr">PagedAttention · Sequence KV Blocks</text>

  <rect x="46" y="130" width="320" height="78" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="60" y="154" class="label">Single Append-Only Geometry</text>
  <text x="60" y="176" class="mono">pool[blocks, block_size, heads, dim]</text>
  <text x="60" y="196" class="sub">Appends strictly along token index t; history is read-only</text>

  <rect x="46" y="222" width="320" height="160" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="60" y="246" class="label" fill="#991b1b">Fragmented Plumbing for Non-KV Algorithms</text>
  <text x="60" y="270" class="sub">· Multi-LoRA: separate adapter cache &amp; dispatcher</text>
  <text x="60" y="292" class="sub">· Steering: module dicts that overwrite live requests</text>
  <text x="60" y="314" class="sub">· Probes: ad-hoc ring buffers &amp; stream events</text>
  <text x="60" y="336" class="sub">· Chunked TTT: bs=1 scripts mutating weights in place</text>
  <text x="60" y="358" class="sub">· Layer switching: hook surgery &amp; CUDA Graph recapture</text>

  <!-- Right Card: PTTS -->
  <rect x="415" y="79" width="477" height="324" rx="6" fill="#111111"/>
  <rect x="412" y="76" width="477" height="324" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="412" y="76" width="477" height="38" rx="6" fill="#0047ab"/>
  <rect x="412" y="102" width="477" height="12" fill="#0047ab"/>
  <text x="650" y="100" text-anchor="middle" class="hdr">PTTS · Whole-Field Slot Pools + Integer Version Roots</text>

  <rect x="430" y="130" width="441" height="62" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="444" y="153" class="mono">SlotPools[cap, *field_shape]  +  StateRef = (slot_0, slot_1, ...)</text>
  <text x="444" y="175" class="sub">Fixed base addresses for CUDA Graphs; transitions publish new slot tuples</text>

  <rect x="430" y="204" width="441" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="440" y="211" width="76" height="20" rx="3" fill="#059669"/>
  <text x="478" y="225" text-anchor="middle" class="badge" fill="#ffffff">PROBES</text>
  <text x="528" y="226" class="sub">Transient tap slots streamed to host over pinned rings</text>

  <rect x="430" y="244" width="441" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="440" y="251" width="76" height="20" rx="3" fill="#0047ab"/>
  <text x="478" y="265" text-anchor="middle" class="badge" fill="#ffffff">STEER/LORA</text>
  <text x="528" y="266" class="sub">Instance or keyed request slots with admission snapshots</text>

  <rect x="430" y="284" width="441" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="440" y="291" width="76" height="20" rx="3" fill="#0047ab"/>
  <text x="478" y="305" text-anchor="middle" class="badge" fill="#ffffff">ONLINE SGD</text>
  <text x="528" y="306" class="sub">Side-stream updates overlapped via lagged root visibility</text>

  <rect x="430" y="324" width="441" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="440" y="331" width="76" height="20" rx="3" fill="#d99b26"/>
  <text x="478" y="345" text-anchor="middle" class="badge" fill="#111111">CHUNK TTT</text>
  <text x="528" y="346" class="sub">Unchanged decode steps carry existing delta slot IDs (0 B copy)</text>

  <rect x="430" y="364" width="441" height="26" rx="4" fill="#fefce8" stroke="#111111" stroke-width="1.2"/>
  <text x="444" y="382" class="sub">LayerRoute: int64 layer selector stored as a field, switching layers without recapture</text>
</svg>
