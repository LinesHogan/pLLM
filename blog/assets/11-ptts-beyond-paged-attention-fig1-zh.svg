<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" role="img" aria-label="PagedAttention 序列追加块表与 PTTS 统一张量状态层对比示意图">
  <style>
    .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 700 13px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 700 12.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 11.4px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .muted { font: 500 10.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52525b; }
    .mono { font: 600 10.8px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 10.2px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.03em; }
  </style>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="972" height="422" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="28" y="34" class="title">FIG 01 · 从序列块表到统一张量状态层：PagedAttention 与 PTTS 的职责分工</text>
  <text x="28" y="54" class="sub">PagedAttention 专管沿位置轴单调追加的 KV 序列；PTTS 用整字段槽池与整数版本根统一各类非 KV 状态</text>

  <rect x="31" y="79" width="402" height="324" rx="6" fill="#111111"/>
  <rect x="28" y="76" width="402" height="324" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="28" y="76" width="402" height="38" rx="6" fill="#111111"/>
  <rect x="28" y="102" width="402" height="12" fill="#111111"/>
  <text x="229" y="100" text-anchor="middle" class="hdr">PagedAttention · 序列维 KV 块表</text>

  <rect x="44" y="130" width="370" height="78" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="58" y="154" class="label">单一几何形状与演化规律</text>
  <text x="58" y="176" class="mono">pool[blocks, block_size, heads, dim]</text>
  <text x="58" y="196" class="sub">仅沿词位置 t 向后追加，历史位置只读不改</text>

  <rect x="44" y="222" width="370" height="160" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="58" y="246" class="label" fill="#991b1b">遇到非 KV 推理期算法时的常见碎裂做法</text>
  <text x="58" y="270" class="sub">· 多 LoRA：单独维护一套异构秩权重池</text>
  <text x="58" y="292" class="sub">· 激活引导：模块属性挂字典，热更新覆盖在途请求</text>
  <text x="58" y="314" class="sub">· 探针导出：手写环形缓冲与跨流拷贝事件</text>
  <text x="58" y="336" class="sub">· 分块快权重 (TTT)：退回 bs=1 脚本原地改矩阵</text>
  <text x="58" y="358" class="sub">· 动态切层：拆旧钩子并重新录制整套 CUDA Graph</text>

  <rect x="455" y="79" width="500" height="324" rx="6" fill="#111111"/>
  <rect x="452" y="76" width="500" height="324" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="452" y="76" width="500" height="38" rx="6" fill="#0047ab"/>
  <rect x="452" y="102" width="500" height="12" fill="#0047ab"/>
  <text x="702" y="100" text-anchor="middle" class="hdr">PTTS · 分页张量状态层（整字段槽池 + 版本根）</text>

  <rect x="468" y="130" width="468" height="62" rx="5" fill="#ffffff" stroke="#0047ab" stroke-width="1.4"/>
  <text x="482" y="153" class="mono">SlotPools[cap, *shape] + StateRef = (slot_0, slot_1, ...)</text>
  <text x="482" y="175" class="sub">基地址固定进 CUDA Graph；更新发布新槽号元组，按作用域与刷新档位读取</text>

  <rect x="468" y="204" width="468" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="478" y="211" width="76" height="20" rx="3" fill="#059669"/>
  <text x="516" y="225" text-anchor="middle" class="badge" fill="#ffffff">瞬态探针</text>
  <text x="566" y="226" class="sub">主干写槽池、旁路拷主机，与可变状态共用同一套槽寻址</text>

  <rect x="468" y="244" width="468" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="478" y="251" width="76" height="20" rx="3" fill="#0047ab"/>
  <text x="516" y="265" text-anchor="middle" class="badge" fill="#ffffff">引导/LoRA</text>
  <text x="566" y="266" class="sub">按实例或请求键切分，准入快照与在线导入互不干扰</text>

  <rect x="468" y="284" width="468" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="478" y="291" width="76" height="20" rx="3" fill="#0047ab"/>
  <text x="516" y="305" text-anchor="middle" class="badge" fill="#ffffff">在线学习</text>
  <text x="566" y="306" class="sub">旁路流梯度更新发布新版本，隔步可见避免双流阻塞</text>

  <rect x="468" y="324" width="468" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="478" y="331" width="76" height="20" rx="3" fill="#d99b26"/>
  <text x="516" y="345" text-anchor="middle" class="badge" fill="#111111">分块递推</text>
  <text x="566" y="346" class="sub">非块边界步直接沿用原增量槽号，省去逐词整页拷贝</text>

  <rect x="468" y="364" width="468" height="26" rx="4" fill="#fefce8" stroke="#111111" stroke-width="1.2"/>
  <text x="482" y="382" class="sub">动态切层路由：将 int64 层号存入状态字段，切换目标层无需重录静态图</text>
</svg>
