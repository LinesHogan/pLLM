<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" role="img" aria-label="研究脚本假设与生产推理引擎假设的架构冲突">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", "PingFang SC", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="392" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <rect x="28" y="24" width="60" height="22" rx="4" fill="#111111"/>
  <text x="58" y="39" text-anchor="middle" class="badge" fill="#ffffff">FIG 02</text>
  <rect x="96" y="24" width="166" height="22" rx="4" fill="#fff1f2" stroke="#111111" stroke-width="1.2"/>
  <text x="179" y="39" text-anchor="middle" class="badge" fill="#e62b2b">静态无状态假设冲突</text>
  <text x="28" y="70" class="title">研究脚本假设 vs 生产引擎假设：为什么新算法跨不过并发门槛</text>
  <line x1="28" y1="84" x2="892" y2="84" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Row 1: Research-script model -->
  <rect x="28" y="98" width="120" height="22" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1.2"/>
  <text x="88" y="113" text-anchor="middle" class="badge" fill="#111111">研究脚本假设</text>
  <text x="160" y="114" class="mono">bs = 1 · 动态可变</text>

  <rect x="28" y="128" width="264" height="78" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="156" class="label">单条序列独占模型</text>
  <text x="44" y="180" class="sub">无多租户并发与调度隔离</text>

  <line x1="292" y1="167" x2="324" y2="167" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="328" y="128" width="264" height="78" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="344" y="156" class="label">Python 逐层可插回调</text>
  <text x="344" y="180" class="sub">每步自由读写中间激活状态</text>

  <line x1="592" y1="167" x2="624" y2="167" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <rect x="631" y="131" width="264" height="78" rx="6" fill="#111111"/>
  <rect x="628" y="128" width="264" height="78" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <text x="644" y="156" class="label">权重随时原地覆盖</text>
  <text x="644" y="180" class="mono">param.add_() in-place</text>

  <!-- Row 2: Serving-engine model -->
  <rect x="28" y="224" width="120" height="22" rx="4" fill="#0047ab"/>
  <text x="88" y="239" text-anchor="middle" class="badge" fill="#ffffff">生产引擎假设</text>
  <text x="160" y="240" class="mono">百路并发 · 静态只读</text>

  <rect x="28" y="254" width="264" height="78" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="44" y="282" class="label">多租户词元拍扁成二维表</text>
  <text x="44" y="306" class="mono">shape = [tokens, H]</text>

  <line x1="292" y1="293" x2="324" y2="293" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="328" y="254" width="264" height="78" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="344" y="282" class="label">算子融合并录死静态图</text>
  <text x="344" y="306" class="mono">Static CUDA Graph</text>

  <line x1="592" y1="293" x2="624" y2="293" stroke="#0047ab" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <rect x="631" y="257" width="264" height="78" rx="6" fill="#111111"/>
  <rect x="628" y="254" width="264" height="78" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <text x="644" y="282" class="label">主旁流无锁异步推进</text>
  <text x="644" y="306" class="sub">除只追加分页 KV 外全只读</text>

  <!-- Collision Callout -->
  <rect x="28" y="346" width="864" height="32" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <rect x="36" y="352" width="54" height="20" rx="4" fill="#e62b2b"/>
  <text x="63" y="366" text-anchor="middle" class="badge" fill="#ffffff">TAX</text>
  <text x="102" y="366" class="label">强行把每请求可变状态塞进静态流水线 → 每个想法先交三周“vLLM 私有分支改造税”</text>
</svg>
