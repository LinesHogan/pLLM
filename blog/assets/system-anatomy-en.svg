<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" role="img" aria-label="System Anatomy Map: Eleven Independent Deep Dives Across a Continuous-Batching Engine">
  <style>
    .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .hdr { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
    .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
    .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
    .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
  </style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="912" height="552" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="28" y="34" class="title">System Anatomy Map · Inference Engine</text>
  <text x="892" y="34" text-anchor="end" class="sub">11 standalone articles across vLLM internals</text>

  <!-- [01] Top Macro Banner -->
  <rect x="31" y="53" width="864" height="54" rx="6" fill="#111111"/>
  <rect x="28" y="50" width="864" height="54" rx="6" fill="#fefce8" stroke="#111111" stroke-width="1.75"/>
  <rect x="42" y="65" width="42" height="24" rx="4" fill="#e62b2b"/>
  <text x="63" y="81" text-anchor="middle" class="badge" fill="#ffffff">01</text>
  <text x="96" y="75" class="label">Macro Economics &amp; Engine Fork Tax: 800:1 Compute-to-Byte Ratio &amp; Dirty Priors</text>
  <text x="96" y="94" class="sub">Why diverging training/inference economics turn 3-week engine forks into the bottleneck of search</text>

  <!-- Connector from [01] to 3-column pipeline -->
  <path d="M 760 104 L 760 132" fill="none" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="158" y1="120" x2="760" y2="120" stroke="#e62b2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="158" y1="120" x2="158" y2="132" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <line x1="458" y1="120" x2="458" y2="132" stroke="#e62b2b" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <!-- Column 1: CPU Scheduling, Unpacking & Verification -->
  <rect x="31" y="141" width="260" height="342" rx="6" fill="#111111"/>
  <rect x="28" y="138" width="260" height="342" rx="6" fill="#f5f5f4" stroke="#111111" stroke-width="1.75"/>
  <rect x="28" y="138" width="260" height="38" rx="6" fill="#111111"/>
  <rect x="28" y="164" width="260" height="12" fill="#111111"/>
  <text x="158" y="162" text-anchor="middle" class="hdr">CPU Schedule, Unpack &amp; Check</text>

  <!-- Col 1 Row 1 [09] -->
  <rect x="42" y="194" width="232" height="76" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="54" y="220" class="mono">attn_metadata</text>
  <text x="54" y="244" class="sub">3-int sync-free unpacking</text>
  <rect x="224" y="206" width="38" height="22" rx="4" fill="#0047ab"/>
  <text x="243" y="221" text-anchor="middle" class="badge" fill="#ffffff">09</text>

  <!-- Col 1 Row 2 [10] -->
  <rect x="42" y="286" width="232" height="76" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="54" y="312" class="label">Schedule-as-Data</text>
  <text x="54" y="336" class="sub">1M salted isolation checks</text>
  <rect x="224" y="298" width="38" height="22" rx="4" fill="#0047ab"/>
  <text x="243" y="313" text-anchor="middle" class="badge" fill="#ffffff">10</text>

  <!-- Col 1 Row 3 [03] -->
  <rect x="42" y="378" width="232" height="82" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="54" y="406" class="label">Zero-Copy PCIe</text>
  <text x="54" y="432" class="mono">32 CTAs</text>
  <text x="116" y="432" class="sub">vs. SM starvation</text>
  <rect x="224" y="390" width="38" height="22" rx="4" fill="#d99b26"/>
  <text x="243" y="405" text-anchor="middle" class="badge" fill="#111111">03</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="288" y1="309" x2="314" y2="309" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <!-- Column 2: GPU Compiled Model Layers & Paged KV -->
  <rect x="323" y="141" width="276" height="342" rx="6" fill="#111111"/>
  <rect x="320" y="138" width="276" height="342" rx="6" fill="#eef4ff" stroke="#111111" stroke-width="1.75"/>
  <rect x="320" y="138" width="276" height="38" rx="6" fill="#0047ab"/>
  <rect x="320" y="164" width="276" height="12" fill="#0047ab"/>
  <text x="458" y="162" text-anchor="middle" class="hdr">GPU Compiled Layers &amp; Paged KV</text>

  <!-- Col 2 Row 1 [05] -->
  <rect x="334" y="194" width="248" height="76" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="346" y="220" class="label">Compile-Time Edits</text>
  <text x="346" y="244" class="mono">torch.compile</text>
  <text x="456" y="244" class="sub">fast weights + TP</text>
  <rect x="532" y="206" width="38" height="22" rx="4" fill="#059669"/>
  <text x="551" y="221" text-anchor="middle" class="badge" fill="#ffffff">05</text>

  <!-- Col 2 Row 2 [08] -->
  <rect x="334" y="286" width="248" height="76" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="346" y="312" class="label">GQA Pack &amp; MLA</text>
  <text x="346" y="336" class="sub">Memory-layout custom attention</text>
  <rect x="532" y="298" width="38" height="22" rx="4" fill="#059669"/>
  <text x="551" y="313" text-anchor="middle" class="badge" fill="#ffffff">08</text>

  <!-- Col 2 Row 3 [03] -->
  <rect x="334" y="378" width="248" height="82" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="346" y="406" class="label">Bandwidth &amp; Quotas</text>
  <text x="346" y="432" class="sub">466 MB/layer stream &amp; layer-skip</text>
  <rect x="532" y="390" width="38" height="22" rx="4" fill="#d99b26"/>
  <text x="551" y="405" text-anchor="middle" class="badge" fill="#111111">03</text>

  <!-- Arrow Col 2 -> Col 3 (top card) -->
  <line x1="596" y1="224" x2="622" y2="224" stroke="#111111" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <!-- Column 3: Decode Tail & Concurrent State -->
  <!-- Top sub-card: Decode Tail [04] -->
  <rect x="631" y="141" width="264" height="122" rx="6" fill="#111111"/>
  <rect x="628" y="138" width="264" height="122" rx="6" fill="#ecfdf5" stroke="#111111" stroke-width="1.75"/>
  <rect x="628" y="138" width="264" height="36" rx="6" fill="#059669"/>
  <rect x="628" y="162" width="264" height="12" fill="#059669"/>
  <text x="760" y="161" text-anchor="middle" class="hdr">Decode Tail &amp; Vocab Sampling</text>

  <rect x="642" y="186" width="236" height="62" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="654" y="210" class="label">Decode Tail &amp; Bits</text>
  <text x="654" y="232" class="mono">IEEE 754</text>
  <text x="724" y="232" class="sub">order-preserving u64</text>
  <rect x="828" y="196" width="38" height="22" rx="4" fill="#059669"/>
  <text x="847" y="211" text-anchor="middle" class="badge" fill="#ffffff">04</text>

  <!-- Bottom sub-card: Concurrent State & Graph Scheduling [11, 06, 07, 02] -->
  <rect x="631" y="275" width="264" height="208" rx="6" fill="#111111"/>
  <rect x="628" y="272" width="264" height="208" rx="6" fill="#fff1f2" stroke="#111111" stroke-width="1.75"/>
  <rect x="628" y="272" width="264" height="34" rx="6" fill="#e62b2b"/>
  <rect x="628" y="294" width="264" height="12" fill="#e62b2b"/>
  <text x="760" y="294" text-anchor="middle" class="hdr">Frozen Graphs &amp; Live State</text>

  <!-- Row [11] -->
  <rect x="642" y="314" width="236" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="654" y="336" class="sub">Unified PTTS state layer</text>
  <rect x="828" y="320" width="38" height="22" rx="4" fill="#0047ab"/>
  <text x="847" y="335" text-anchor="middle" class="badge" fill="#ffffff">11</text>

  <!-- Row [06] -->
  <rect x="642" y="354" width="236" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="654" y="376" class="sub">Graph pointer smuggling</text>
  <rect x="828" y="360" width="38" height="22" rx="4" fill="#111111"/>
  <text x="847" y="375" text-anchor="middle" class="badge" fill="#ffffff">06</text>

  <!-- Row [07] -->
  <rect x="642" y="394" width="236" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="654" y="416" class="sub">GPU MVCC &amp; async RCU</text>
  <rect x="828" y="400" width="38" height="22" rx="4" fill="#111111"/>
  <text x="847" y="415" text-anchor="middle" class="badge" fill="#ffffff">07</text>

  <!-- Row [02] -->
  <rect x="642" y="434" width="236" height="34" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="654" y="456" class="sub">8-tick longest path</text>
  <rect x="828" y="440" width="38" height="22" rx="4" fill="#e62b2b"/>
  <text x="847" y="455" text-anchor="middle" class="badge" fill="#ffffff">02</text>

  <!-- Vertical arrow between Col 3 top and bottom -->
  <line x1="760" y1="260" x2="760" y2="270" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Feedback Loop: Col 3 Concurrent State -> Col 2 Compiled GPU Layers -->
  <path d="M 628 454 L 592 454 L 592 514 L 458 514 L 458 486" fill="none" stroke="#0047ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="421" y="500" width="370" height="26" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.25"/>
  <text x="606" y="518" text-anchor="middle" class="sub" fill="#0047ab">Cross-step loop: schedule &amp; PTTS state feed forward</text>
</svg>
