<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="100%" role="img" aria-label="Channel B byte accounting: partial early exit still streams 466 MB of layer weights dropping throughput to 98%, whereas full-batch skip short-circuits 1.86 GB of reads for 112% throughput">
  <defs>
    <style>
      .title { font: 700 16px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 600 13.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .sub { font: 400 12.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #3f3f46; }
      .mono { font: 600 12.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #111111; }
      .badge { font: 700 11px "JetBrains Mono", monospace; letter-spacing: 0.04em; }
      .metric { font: 700 22px "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- Outer Zine Card -->
  <rect x="4" y="4" width="912" height="444" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title">Channel B Byte Accounting: Why Partial Early Exit Saves Zero Milliseconds</text>
  <text x="32" y="59" class="sub">A 7B model streams ~466 MB weights/layer; in skinny GEMMs, even 1 active row forces a full read</text>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Case A Card -->
  <rect x="35" y="93" width="856" height="138" rx="6" fill="#111111"/>
  <rect x="32" y="90" width="856" height="138" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <rect x="48" y="102" width="76" height="22" rx="4" fill="#d99b26"/>
  <text x="86" y="117" text-anchor="middle" class="badge" fill="#ffffff">CASE A</text>
  <text x="136" y="118" class="label">Threshold 0.85: 8 of 32 rows skip (~23%); 24 active rows enter Layers 16–19</text>

  <!-- Case A Batch Strip -->
  <rect x="48" y="138" width="136" height="38" rx="4" fill="#eef4ff" stroke="#0047ab" stroke-width="1.6"/>
  <text x="116" y="161" text-anchor="middle" class="mono" fill="#0047ab">24 Active</text>
  <rect x="186" y="138" width="56" height="38" rx="4" fill="#f5f5f4" stroke="#111111" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="214" y="161" text-anchor="middle" class="sub">8 Skip</text>
  <text x="145" y="198" text-anchor="middle" class="sub">Active &gt; 0 (even 1 row)</text>

  <!-- Arrow 1 -->
  <line x1="246" y1="157" x2="268" y2="157" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Case A Middle Explanation -->
  <rect x="274" y="136" width="428" height="76" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="290" y="158" class="label">SMs still stream 100% of weights (4 × 466 MB)</text>
  <text x="290" y="179" class="sub">+ ~7% KV propagation + argsort gather/scatter</text>
  <text x="290" y="199" class="sub" fill="#e62b2b">Zero VRAM saved; extra compaction bookkeeping</text>

  <!-- Arrow 2 -->
  <line x1="706" y1="174" x2="730" y2="174" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Case A Throughput Box -->
  <rect x="736" y="136" width="136" height="76" rx="5" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <text x="804" y="168" text-anchor="middle" class="metric" fill="#e62b2b">98%</text>
  <text x="804" y="189" text-anchor="middle" class="sub">Throughput</text>
  <text x="804" y="205" text-anchor="middle" class="sub">(vs 99% base)</text>

  <!-- Case B Card -->
  <rect x="35" y="247" width="856" height="138" rx="6" fill="#111111"/>
  <rect x="32" y="244" width="856" height="138" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>

  <rect x="48" y="256" width="76" height="22" rx="4" fill="#059669"/>
  <text x="86" y="271" text-anchor="middle" class="badge" fill="#ffffff">CASE B</text>
  <text x="136" y="272" class="label">Full-batch skip: all 32 rows skip together (active count == 0)</text>

  <!-- Case B Batch Strip -->
  <rect x="48" y="292" width="194" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="145" y="315" text-anchor="middle" class="mono" fill="#059669">All 32 Skipped</text>
  <text x="145" y="352" text-anchor="middle" class="sub">Active rows == 0</text>

  <!-- Arrow 1 -->
  <line x1="246" y1="311" x2="268" y2="311" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Case B Middle Explanation -->
  <rect x="274" y="290" width="428" height="76" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="290" y="312" class="label">Conditional IF node short-circuits Layers 16–19</text>
  <text x="290" y="333" class="sub">Skips 4 full layer reads (4 × 466 MB ≈ 1.86 GB)</text>
  <text x="290" y="353" class="sub" fill="#059669">Eliminates Channel B weight-streaming bottleneck!</text>

  <!-- Arrow 2 -->
  <line x1="706" y1="328" x2="730" y2="328" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow-ink)"/>

  <!-- Case B Throughput Box -->
  <rect x="736" y="290" width="136" height="76" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="804" y="322" text-anchor="middle" class="metric" fill="#059669">112%</text>
  <text x="804" y="343" text-anchor="middle" class="sub">Throughput</text>
  <text x="804" y="359" text-anchor="middle" class="sub">(+13% vs base)</text>

  <!-- Bottom Verification Guardrail Bar -->
  <rect x="32" y="396" width="856" height="30" rx="5" fill="#f5f5f4" stroke="#111111" stroke-width="1.25"/>
  <text x="460" y="415" text-anchor="middle" class="sub">Verification: Fluent prose hides drift — KL divergence hits 0.131 (23% skip) and 0.868 (100% skip).</text>
</svg>
