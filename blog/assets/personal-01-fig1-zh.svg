<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 348" width="100%" role="img" aria-label="故障定位：AOT 函数化的“克隆—执行—回写”如何用空白备份冲掉原池数据">
  <defs>
    <style>
      .title { font: 700 15.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sec { font: 700 12px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { font: 600 11.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label-sm { font: 600 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub { font: 400 10.5px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .sub-sm { font: 400 9.8px "DM Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 600 10.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .mono-sm { font: 600 9.5px "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .badge { font: 700 10px "JetBrains Mono", "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e62b2b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0047ab"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1032" height="340" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="20" y="16" width="106" height="24" rx="4" fill="#e62b2b"/>
  <text x="73.0" y="32" text-anchor="middle" class="badge" fill="#ffffff">ROOT CAUSE</text>
  <text x="138" y="33" class="title" fill="#111111">故障定位：AOT 函数化的“克隆—执行—回写”如何用空白备份冲掉原池数据</text>
  <line x1="20" y1="48" x2="1020" y2="48" stroke="#e4e4e7" stroke-width="1.4"/>
  <rect x="24" y="62" width="992" height="82" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="38" y="74" width="132" height="22" rx="4" fill="#059669"/>
  <text x="104" y="89" text-anchor="middle" class="label-sm" fill="#ffffff">即时模式 EAGER</text>
  <text x="44" y="122" class="mono" fill="#111111">probe_pool = [0, 0, 0, 0]</text>
  <line x1="252" y1="118" x2="294" y2="118" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="298" y="92" width="440" height="40" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="518" y="116" text-anchor="middle" class="sub" fill="#3f3f46">没有克隆副本，hook.pool.copy_(x) 直接改在原张量上</text>
  <line x1="738" y1="112" x2="780" y2="112" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <rect x="784" y="92" width="214" height="40" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="891" y="116" text-anchor="middle" class="label" fill="#065f46">读出: [7, 7, 7, 7]</text>
  <rect x="24" y="158" width="992" height="168" rx="6" fill="#fff1f2" stroke="#e62b2b" stroke-width="1.5"/>
  <rect x="38" y="170" width="408" height="22" rx="4" fill="#e62b2b"/>
  <text x="242" y="185" text-anchor="middle" class="label-sm" fill="#ffffff">编译模式：声明 mutates_args 却绕过形参改原件</text>
  <rect x="38" y="204" width="290" height="54" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="183" y="224" text-anchor="middle" class="label" fill="#111111">1. 编译器前置克隆复印件 (Clone)</text>
  <text x="183" y="244" text-anchor="middle" class="mono-sm" fill="#111111">writes_clone = [0, 0, 0, 0]</text>
  <line x1="328" y1="231" x2="358" y2="231" stroke="#111111" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="362" y="204" width="320" height="54" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>
  <text x="522" y="224" text-anchor="middle" class="label" fill="#111111">2. 算子绕过形参直接改了原件</text>
  <text x="522" y="244" text-anchor="middle" class="sub-sm" fill="#52525b">原池变 [7,7,7,7]，但 writes_clone 仍是全零！</text>
  <line x1="682" y1="231" x2="712" y2="231" stroke="#e62b2b" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <rect x="716" y="204" width="282" height="54" rx="5" fill="#ffe4e6" stroke="#e62b2b" stroke-width="1.6"/>
  <text x="857" y="224" text-anchor="middle" class="label" fill="#991b1b">3. 尾声拿复印件盖回原件 (Copy-back)</text>
  <text x="857" y="244" text-anchor="middle" class="mono-sm" fill="#991b1b">probe_pool.copy_(writes_clone)</text>
  <rect x="38" y="270" width="960" height="42" rx="5" fill="#ffffff" stroke="#e62b2b" stroke-width="1.3"/>
  <text x="518" y="295" text-anchor="middle" class="sub" fill="#991b1b">一句话直觉：编译器以为你会改它递给你的复印件 writes_clone，结果你偷偷改了抽屉里的原件，算子一结束编译器把空白复印件盖回了原件上。</text>
</svg>
